# GoogleMapD 配置文件示例

# 下载配置
download:
  workers: 10              # 并发数
  rate_limit: 0            # 速率限制 (QPS)，0=不限制
  retry: 3                 # 重试次数
  timeout: 30s             # 请求超时
  max_tiles: 100000        # 单次最大瓦片数
  checkpoint_interval: 100 # 检查点保存间隔

# 验证配置
validation:
  enabled: true
  min_file_size: 1024      # 最小文件大小 (字节)
  max_file_size: 524288    # 最大文件大小 (512KB)
  skip_empty: true         # 跳过空白瓦片

# 代理配置
proxy:
  enabled: false
  url: ""                  # 单个代理地址
  pool_file: ""            # 代理池文件
  rotate_interval: 100     # 代理轮换间隔

# 输出配置
output:
  dir: ./output
  format: png              # png|jpg|webp
  structure: xyz           # 示例字段；如需控制目录结构，请显式传 --scheme

# HTTP 客户端配置
http:
  max_idle_conns: 100      # 最大空闲连接数
  max_conns_per_host: 20   # 每主机最大连接数
  idle_conn_timeout: 90s   # 空闲连接超时
  keep_alive: 30s          # Keep-Alive 时间

# 日志配置
logging:
  level: info              # debug|info|warn|error
  format: text             # text|json
  file: ""                 # 日志文件路径

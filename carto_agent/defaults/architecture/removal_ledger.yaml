    remove_in_wave: after_resource_id_management_next_release
    evidence_required:
      - '按编号的 R51/R60 管理接口发布一个版本，全部资源库调用方已迁移。'
      - '旧名称接口调用统计与外部集成确认无剩余依赖。'
    blocking_tests:

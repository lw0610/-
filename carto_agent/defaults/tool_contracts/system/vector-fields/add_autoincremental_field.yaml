apiVersion: tool_contract/v1
kind: ToolContract
metadata:
  name: add_autoincremental_field
  display_name: 添加自增量字段
  domain: vector-fields
  runtime: qgis
policy:
  visibility: public
  authorization:
    scopes:
      - tool.invoke
spec:
  description: 添加自动递增的整数字段
  parameters:
    - name: INPUT
      type: layer
      required: true
      description: 输入图层
    - name: FIELD_NAME
      type: string
      description: 字段名称
      default: AUTO
    - name: START
      type: integer
      description: 起始值
      default: 0
    - name: MODULUS
      type: integer
      description: 模数（0表示不使用）
      default: 0
    - name: GROUP_FIELDS
      type: fields
      description: 分组字段
      default: []
    - name: SORT_EXPRESSION
      type: expression
      description: 排序表达式
      default: ""
    - name: SORT_ASCENDING
      type: boolean
      description: 升序排序
      default: true
    - name: SORT_NULLS_FIRST
      type: boolean
      description: 空值优先
      default: false
    - name: OUTPUT
      type: output_layer
      description: 输出图层
      default: 'memory:'
execution:
  binding: backend_tool
  backend_tool: add_autoincremental_field
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD_NAME: '{{ FIELD_NAME }}'
    START: '{{ START }}'
    MODULUS: '{{ MODULUS }}'
    GROUP_FIELDS: '{{ GROUP_FIELDS }}'
    SORT_EXPRESSION: '{{ SORT_EXPRESSION }}'
    SORT_ASCENDING: '{{ SORT_ASCENDING }}'
    SORT_NULLS_FIRST: '{{ SORT_NULLS_FIRST }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

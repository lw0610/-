apiVersion: tool_contract/v1
kind: ToolContract
metadata:
  name: get_layers_info
  display_name: get_layers_info
  domain: project-state
  runtime: qgis
policy:
  visibility: public
  authorization:
    scopes:
      - tool.invoke
spec:
  description: 获取当前项目中所有图层的详细信息列表
  parameters:
    - name: include_invisible
      type: boolean
      description: 是否包含不可见图层
execution:
  binding: handler
  handler_file: tools/system/project-state/handlers/project.py
  handler_function: get_layers_info
  param_mapping:
    include_invisible: '{{ include_invisible }}'

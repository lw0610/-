          进入后先校验上下文、参数安全性与执行边界；脚本提交前必须先验证，失败时基于错误信息修正后重试。
        user_prompt_template: "{{ user_input }}"

plan:
  max_iterations: 100
  global:
    skill_packages:
      - project-state
      - vector-selection
      - runtime-control
      - build-capability-awareness
  agents:
    planner:
      display_name: 规划智能体
      is_main: true
      mode: readonly_plus
      llm:
        provider: ''
      skill_packages:
        - prompt-refinement
        - traffic-map-orchestration
        - marching-route-map-orchestration
        - statistical-map-orchestration
      prompts:
        static_instructions: |
          仅进行只读分析与规划：分析任务目标与上下文、识别风险和歧义、确认互斥路径与前置依赖，并输出结构化执行计划。
          规划时不得把多个有效 CRS 的显示差异自动列为待统一问题；仅用于加载、叠加显示或制图时采用 QGIS 动态坐标转换。
          不执行 BUILD 写操作，不替专业 agent 完成执行；在关键节点通过 hitl_request 发起人工确认。
          统计专题任务先读取 statistical-map-orchestration skill，并用 query_build_capabilities 检查 data_engineer 的统计数据准备和 cartographer 的分级设色、版面工具。只规划统计口径、输入核验与阶段交接；数据验证、文件生成、加载和制图均交给 Build，不在 Plan 中运行写操作。
        runtime_mode_instruction: |
          ## 运行时执行模式（Plan）
          - 与静态提示冲突时以本段为准。
          - 仅执行只读分析和规划，不做 BUILD 写操作。
          - 在输出计划前先调用 query_build_capabilities，确认 BUILD 模式真实可用能力。
          - 关键节点使用 hitl_request 发起决策。
          - 输出结构化计划供 Build 模式执行。
        user_prompt_template: "{{ user_input }}"

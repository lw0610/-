          - strong [ref=f2e53]: 河南省第七次全国人口普查公报（第二号）
        - paragraph [ref=f2e54]:
          - strong [ref=f2e56]: ──地区常住人口情况
        - paragraph [ref=f2e57]
        - paragraph [ref=f2e58]: 河南省统计局
        - paragraph [ref=f2e59]: 河南省第七次全国人口普查领导小组办公室
        - paragraph [ref=f2e60]: 2021年5月14日
        - paragraph [ref=f2e61]
        - paragraph [ref=f2e62]: 根据第七次全国人口普查结果，现将2020年11月1日零时全省分地区的常住人口有关数据公布如下：
        - paragraph [ref=f2e63]
        - paragraph [ref=f2e64]:
          - img "河南省第七次全国人口普查公报（第二号）" [ref=f2e66]
        - paragraph [ref=f2e67]
        - paragraph [ref=f2e68]
        - paragraph [ref=f2e69]: 注释：
        - paragraph [ref=f2e70]: "[1]本公报数据均为初步汇总数据。"
        - paragraph [ref=f2e71]: "[2]常住人口包括：居住在本乡镇街道且户口在本乡镇街道或户口待定的人；居住在本乡镇街道且离开户口登记地所在的乡镇街道半年以上的人；户口在本乡镇街道且外出不满半年或在境外工作学习的人。"
        - paragraph [ref=f2e72]: "[3]指各省辖市、省直管县（市）的常住人口占全省常住人口的比重。"
        - paragraph [ref=f2e73]: "[4]带＃的为省直管县（市），各省辖市数据含省直管县（市）。"
        - paragraph [ref=f2e74]: "[5]部分数据因四舍五入的原因，存在总计与分项合计不等的情况。"
        - paragraph [ref=f2e75]
        - paragraph [ref=f2e76]

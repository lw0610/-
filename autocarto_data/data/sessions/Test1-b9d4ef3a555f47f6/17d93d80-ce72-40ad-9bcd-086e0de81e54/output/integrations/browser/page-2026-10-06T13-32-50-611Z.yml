        - generic [ref=f3e72]:
          - paragraph [ref=f3e73]: 中商情报网讯：近日，河南统计局发布了河南省第七次全国人口普查主要数据情况，人口普查结果显示，河南省人口十年来继续保持平稳增长态势。2020年河南省常住人口共9936.6万人，占全国人口的7.04%，位居全国第三，低于广东和山东，与2010年第六次全国人口普查的9402.4万人相比，增加534.2万人，增长5.68%，年平均增长率为0.55%。
          - paragraph [ref=f3e74]: 郑州市常住人口最多达1260.06万人，占比12.68%。南阳市、周口市排名第二和第三，常住人口分别为971.31万人、902.60万人。此外，商丘市、洛阳市、驻马店市、新乡市、信阳市、安阳市常住人口超500万人。
          - paragraph [ref=f3e75]: 2010年第六次全国人口普查相比，郑州常住人口增量最大达397.41万人，新乡市、洛阳市常住人口增量超50万人。值得注意的是，鹤壁市、焦作市、漯河市、三门峡市、驻马店市、南阳市人口负增长。
          - paragraph [ref=f3e76]
          - paragraph [ref=f3e77]: 数据来源：中商产业研究院大数据库

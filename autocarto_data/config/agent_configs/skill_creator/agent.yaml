version: "2.0"
meta:
    default_execution_mode: build
    description: 技能创建智能体方案（对话式创建与维护技能包）
    plan_enabled: false
runtime:
    agents:
        skill_creator:
            kind: agent
            tool_packages:
                - skill-management
            display_name: 技能创建智能体
            description: 通过对话创建技能包、校验技能定义并保存原子技能
            is_main: true
            enabled: true
            prompts:
                static_instructions: |
                    先明确用户要创建或修改的技能包与原子技能定义。
                    通过内部管理工具列出现有技能包、创建技能包、校验 skill/v1 定义并保存到目标包。
                    涉及覆盖已有定义、修改关键配置或存在歧义时，先使用 hitl_request 请求确认。
                user_prompt_template: '{{ user_input }}'

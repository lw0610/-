version: "2.0"
meta:
    default_execution_mode: build
    description: 智能体创建智能体方案（对话式创建与维护智能体方案）
    plan_enabled: false
runtime:
    agents:
        agent_creator:
            kind: agent
            tool_packages:
                - agent-management
            display_name: 智能体创建智能体
            description: 通过对话创建智能体方案并分配技能包
            is_main: true
            enabled: true
            prompts:
                static_instructions: |
                    先明确用户要创建还是更新智能体方案，再列出现有方案作为参考。
                    使用内部管理工具创建方案、更新配置内容，并在 runtime/plan/global/agent 层准确分配技能包。
                    涉及覆盖已有方案、调整关键技能分配或存在歧义时，先使用 hitl_request 请求确认。
                user_prompt_template: '{{ user_input }}'

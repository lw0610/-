apiVersion: tool/v1
kind: Tool
metadata:
  name: save_vector_features_to_file
  keywords: ["矢量要素", "保存矢量要素", "文件管理", "数据文件"]
  display_name: "保存矢量要素"
  domain: file-operations
  runtime: qgis
spec:
  description: 将矢量要素保存到文件
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: file
    required: true
    description: 输出文件路径
execution:
  backend_tool: native:savefeatures
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'

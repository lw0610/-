apiVersion: tool/v1
kind: Tool
metadata:
  name: package_layers
  keywords: ["图层数据", "打包图层数据", "文件管理", "数据文件"]
  display_name: "打包图层数据"
  domain: file-operations
  runtime: qgis
spec:
  description: "将输入图层打包为 GeoPackage 文件，返回实际输出路径。未指定输出时使用当前运行环境的默认导出目录。"
  parameters:
  - name: LAYERS
    type: multi_layer
    required: true
    description: 输入图层列表
  - name: OUTPUT
    type: file
    description: 输出GeoPackage文件（可选，默认输出到autoc/exports目录）
execution:
  backend_tool: package_layers
  param_mapping:
    LAYERS: '{{ LAYERS }}'
    OUTPUT: '{{ OUTPUT }}'

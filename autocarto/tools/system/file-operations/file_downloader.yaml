apiVersion: tool/v1
kind: Tool
metadata:
  name: file_downloader
  keywords: ["远程文件", "下载远程文件", "文件管理", "数据文件"]
  display_name: "下载远程文件"
  domain: file-operations
  runtime: qgis
policy:
  visibility: hidden
spec:
  description: "从给定网址下载文件，返回实际保存路径。未指定目标目录时使用当前运行环境的默认下载目录。"
  parameters:
  - name: URL
    type: string
    required: true
    description: 下载URL
  - name: OUTPUT
    type: file
    description: 输出文件路径（可选，默认输出到autoc目录）
execution:
  backend_tool: file_downloader
  param_mapping:
    URL: '{{ URL }}'
    OUTPUT: '{{ OUTPUT }}'

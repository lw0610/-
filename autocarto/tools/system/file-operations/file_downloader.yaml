apiVersion: tool/v1
kind: Tool
metadata:
  name: file_downloader
  display_name: 文件下载
  domain: file-operations
  runtime: qgis
spec:
  description: 从URL下载文件。默认下载到autoc/downloads目录
  parameters:
  - name: URL
    type: string
    required: true
    description: 下载URL
  - name: OUTPUT
    type: file
    description: 输出文件路径（可选，默认输出到autoc目录）
execution:
  backend_tool: file_downloader
  param_mapping:
    URL: '{{ URL }}'
    OUTPUT: '{{ OUTPUT }}'

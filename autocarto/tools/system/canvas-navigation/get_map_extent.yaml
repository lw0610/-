apiVersion: tool/v1
kind: Tool
metadata:
  name: get_map_extent
  keywords: ["画布范围", "查询画布范围", "地图画布", "地图缩放", "显示范围"]
  display_name: "读取画布范围"
  domain: canvas-navigation
  runtime: qgis
spec:
  description: 获取当前地图画布的显示范围
  parameters:
    - name: format
      type: string
      description: 返回格式：bbox（边界框）或wkt（WKT格式）
      default: bbox
      values: [bbox, wkt]
execution:
  handler: handlers.canvas.get_map_extent
  param_mapping:
    format: '{{ format }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: canvas_zoom_to_layer
  keywords: ["图层范围", "缩放到图层范围", "地图画布", "地图缩放", "显示范围"]
  display_name: "缩放到图层范围"
  domain: canvas-navigation
  runtime: qgis
spec:
  description: 缩放到图层范围
  parameters:
    - name: layer
      type: string
      required: true
      description: 图层名称
execution:
  handler: handlers.canvas.zoom_to_layer_handler
  param_mapping:
    layer: '{{ layer }}'

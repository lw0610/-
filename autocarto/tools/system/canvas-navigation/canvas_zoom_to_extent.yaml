apiVersion: tool/v1
kind: Tool
metadata:
  name: canvas_zoom_to_extent
  display_name: canvas_zoom_to_extent
  domain: canvas-navigation
  runtime: qgis
spec:
  description: 缩放到指定范围
  parameters:
    - name: xmin
      type: number
      required: true
      description: 最小X坐标
    - name: ymin
      type: number
      required: true
      description: 最小Y坐标
    - name: xmax
      type: number
      required: true
      description: 最大X坐标
    - name: ymax
      type: number
      required: true
      description: 最大Y坐标
execution:
  handler: handlers.canvas.zoom_to_extent_handler
  param_mapping:
    xmin: '{{ xmin }}'
    ymin: '{{ ymin }}'
    xmax: '{{ xmax }}'
    ymax: '{{ ymax }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: canvas_set_scale
  keywords: ["画布比例尺", "配置画布比例尺", "地图画布", "地图缩放", "显示范围"]
  display_name: "设置画布比例尺"
  domain: canvas-navigation
  runtime: qgis
spec:
  description: 设置地图比例尺
  parameters:
    - name: scale
      type: number
      required: true
      description: 比例尺分母(如10000表示1:10000)
execution:
  handler: handlers.canvas.set_scale_handler
  param_mapping:
    scale: '{{ scale }}'

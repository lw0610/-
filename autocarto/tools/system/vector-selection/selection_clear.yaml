apiVersion: tool/v1
kind: Tool
metadata:
  name: selection_clear
  keywords: ["要素选择", "清除要素选择", "要素筛选", "条件选择", "要素提取"]
  display_name: "清除要素选择"
  domain: vector-selection
  runtime: qgis
spec:
  description: 清除选择
  parameters:
    - name: layer
      type: string
      description: 图层名称(可选，不指定则清除所有)
execution:
  handler: handlers.selection.clear_selection_handler
  param_mapping:
    layer: '{{ layer }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: geocode_nominatim
  display_name: Nominatim地理编码
  domain: geocoding
  runtime: qgis
spec:
  description: 使用Nominatim进行批量地理编码
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入点图层
  - name: FIELD
    type: field
    required: true
    description: 地址字段
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: geocode_nominatim
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

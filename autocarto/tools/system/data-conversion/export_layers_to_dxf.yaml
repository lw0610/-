apiVersion: tool/v1
kind: Tool
metadata:
  name: export_layers_to_dxf
  keywords: ["绘图交换文件", "输出绘图交换文件", "格式转换", "数据转换"]
  display_name: "导出绘图交换文件"
  domain: data-conversion
  runtime: qgis
spec:
  description: 将图层导出为DXF格式
  parameters:
  - name: LAYERS
    type: multi_layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: file
    description: 输出DXF文件
execution:
  backend_tool: export_layers_to_dxf
  param_mapping:
    LAYERS: '{{ LAYERS }}'
    OUTPUT: '{{ OUTPUT }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: convert_raster_to_vector
  keywords: ["栅格为矢量", "转为栅格为矢量", "格式转换", "数据转换"]
  display_name: "转换栅格为矢量"
  domain: data-conversion
  runtime: qgis
spec:
  description: 将栅格转换为矢量多边形
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入栅格
  - name: BAND
    type: integer
    description: "波段号（从 1 开始的波段序号）"
    default: 1
  - name: OUTPUT
    type: output_layer
    description: 输出矢量
execution:
  backend_tool: convert_raster_to_vector
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

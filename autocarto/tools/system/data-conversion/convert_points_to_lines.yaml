apiVersion: tool/v1
kind: Tool
metadata:
  name: convert_points_to_lines
  display_name: 点转线
  domain: data-conversion
  runtime: qgis
spec:
  description: 将点连接成线
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入点图层
  - name: ORDER_FIELD
    type: field
    description: 排序字段
  - name: OUTPUT
    type: output_layer
    description: 输出线图层
execution:
  backend_tool: convert_points_to_lines
  param_mapping:
    INPUT: '{{ INPUT }}'
    ORDER_FIELD: '{{ ORDER_FIELD }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

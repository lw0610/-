apiVersion: tool/v1
kind: Tool
metadata:
  name: pdal_to_raster
  display_name: 点云转栅格
  domain: point-cloud
  runtime: qgis
spec:
  description: 将点云导出为栅格
  parameters:
  - name: INPUT
    type: file
    required: true
    description: 输入点云文件
  - name: RESOLUTION
    type: number
    description: 栅格分辨率
    default: 1.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: pdal_to_raster
  param_mapping:
    INPUT: '{{ INPUT }}'
    RESOLUTION: '{{ RESOLUTION }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: random_points_in_extent
  keywords: ["按范围生成随机点", "矢量生成", "点线面", "空间网格"]
  display_name: "按范围生成随机点"
  domain: vector-creation
  runtime: qgis
spec:
  description: 在指定范围内创建随机点
  parameters:
  - name: EXTENT
    type: extent
    required: true
    description: 范围
  - name: POINTS_NUMBER
    type: integer
    description: "点数量（数量，正整数）"
    default: 1
  - name: TARGET_CRS
    type: crs
    description: 目标坐标系
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: random_points_in_extent
  param_mapping:
    EXTENT: '{{ EXTENT }}'
    POINTS_NUMBER: '{{ POINTS_NUMBER }}'
    TARGET_CRS: '{{ TARGET_CRS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

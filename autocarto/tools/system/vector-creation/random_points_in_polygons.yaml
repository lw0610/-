apiVersion: tool/v1
kind: Tool
metadata:
  name: random_points_in_polygons
  keywords: ["按面域生成随机点", "矢量生成", "点线面", "空间网格"]
  display_name: "按面域生成随机点"
  domain: vector-creation
  runtime: qgis
spec:
  description: 在多边形内创建随机点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: POINTS_NUMBER
    type: integer
    description: "点数量（数量，正整数）"
    default: 1
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: random_points_in_polygons
  param_mapping:
    INPUT: '{{ INPUT }}'
    POINTS_NUMBER: '{{ POINTS_NUMBER }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

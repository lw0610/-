apiVersion: tool/v1
kind: Tool
metadata:
  name: random_points_in_polygons
  display_name: 在多边形内随机点
  domain: vector-creation
  runtime: qgis
spec:
  description: 在多边形内创建随机点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: POINTS_NUMBER
    type: integer
    description: 点数量
    default: 1
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: random_points_in_polygons
  param_mapping:
    INPUT: '{{ INPUT }}'
    POINTS_NUMBER: '{{ POINTS_NUMBER }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

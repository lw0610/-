apiVersion: tool/v1
kind: Tool
metadata:
  name: regular_points
  display_name: 规则点
  domain: vector-creation
  runtime: qgis
spec:
  description: 创建规则分布的点
  parameters:
  - name: EXTENT
    type: extent
    required: true
    description: 范围
  - name: SPACING
    type: number
    description: 点间距
    default: 100.0
  - name: CRS
    type: crs
    description: 坐标系
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: regular_points
  param_mapping:
    EXTENT: '{{ EXTENT }}'
    SPACING: '{{ SPACING }}'
    CRS: '{{ CRS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

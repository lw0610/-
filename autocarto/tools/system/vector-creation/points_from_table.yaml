apiVersion: tool/v1
kind: Tool
metadata:
  name: points_from_table
  keywords: ["按表格坐标创建点", "矢量生成", "点线面", "空间网格"]
  display_name: "按表格坐标创建点"
  domain: vector-creation
  runtime: qgis
spec:
  description: 从表格的XY坐标创建点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入表格
  - name: XFIELD
    type: field
    required: true
    description: X字段
  - name: YFIELD
    type: field
    required: true
    description: Y字段
  - name: TARGET_CRS
    type: crs
    description: 目标坐标系
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: points_from_table
  param_mapping:
    INPUT: '{{ INPUT }}'
    XFIELD: '{{ XFIELD }}'
    YFIELD: '{{ YFIELD }}'
    TARGET_CRS: '{{ TARGET_CRS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: find_projection
  keywords: ["图层投影", "查找图层投影", "坐标系", "投影转换", "坐标转换"]
  display_name: "查找图层投影"
  domain: crs-projection
  runtime: qgis
spec:
  description: 查找图层可能的投影
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: TARGET_AREA
    type: extent
    required: true
    description: 目标区域范围
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: find_projection
  param_mapping:
    INPUT: '{{ INPUT }}'
    TARGET_AREA: '{{ TARGET_AREA }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: gee_cancel_task
  keywords: ["云端任务", "取消云端任务", "遥感影像", "云端计算", "影像下载"]
  display_name: "取消云端任务"
  domain: gee-remote-sensing
  runtime: internal
spec:
  description: "仅在用户要求取消指定云任务时调用；本地脚本退出不会自动取消云端任务。"
  parameters:
    - name: task_id
      type: string
      required: true
      description: "需要取消的真实任务 ID 或 operation name"
policy:
  visibility: public
  authorization_scopes:
    - tool.invoke
execution:
  backend_tool: gee_cancel_task
  param_mapping:
    task_id: '{{ task_id }}'

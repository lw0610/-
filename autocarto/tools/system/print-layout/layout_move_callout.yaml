apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_move_callout
  keywords: ["图文标注", "整体移动图文标注", "打印版面", "地图排版", "版面元素"]
  display_name: "整体移动图文标注"
  runtime: qgis
  domain: print-layout
spec:
  description: >-
    将一组图文标注的边框、图片、标题和正文整体移动到新的绝对位置，保持各子元素
    的相对位置与尺寸不变，并在固定地图锚点的前提下重新计算直线、曲线或双线牵引线。
    使用图文标注创建工具返回的真实分组编号；完整内容与牵引线均检查容器和页面边界。
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: callout_item_ids
    type: object
    required: true
    description: >-
      创建工具原样返回的 created_item_ids 对象。box 必填；image/title/body 可选；
      leader 可为一个字符串或字符串数组。禁止根据命名规则猜测或重建 ID。
  - name: x
    type: number
    required: true
    description: 移动后标注框左上角的绝对 X 坐标，单位 mm
  - name: y
    type: number
    required: true
    description: 移动后标注框左上角的绝对 Y 坐标，单位 mm
  - name: container_item_id
    type: string
    required: true
    description: "标注框必须完整位于其中的容器元素真实编号，通常使用主地图框编号"
  - name: margin_mm
    type: number
    required: false
    default: 0
    description: 标注框与容器边界之间至少保留的距离，单位 mm
execution:
  handler: handlers.layout_advanced.move_callout_handler
  param_mapping:
    layout: '{{ layout }}'
    callout_item_ids: '{{ callout_item_ids }}'
    x: '{{ x }}'
    y: '{{ y }}'
    container_item_id: '{{ container_item_id }}'
    margin_mm: '{{ margin_mm }}'

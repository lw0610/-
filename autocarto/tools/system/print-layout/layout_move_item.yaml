apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_move_item
  keywords: ["版面元素", "移动版面元素", "打印版面", "地图排版"]
  display_name: "移动版面元素"
  runtime: qgis
  domain: print-layout
spec:
  description: 移动布局元素位置
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 元素ID
  - name: x
    type: number
    required: true
    description: 新X坐标(mm)
  - name: y
    type: number
    required: true
    description: 新Y坐标(mm)
  - name: container_item_id
    type: string
    required: false
    description: 可选容器真实编号，或 page 表示所在页面；提供时完整矩形必须同时位于容器和页面内，否则拒绝并返回越界边
execution:
  handler: handlers.layout_items.move_item_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    x: '{{ x }}'
    y: '{{ y }}'
    container_item_id: '{{ container_item_id }}'

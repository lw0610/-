apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_get_items_properties
  keywords: ["元素属性", "批量读取元素属性", "打印版面", "地图排版", "版面元素"]
  display_name: "批量读取元素属性"
  runtime: qgis
  domain: print-layout
spec:
  description: >-
    一次读取布局元素的真实毫米矩形、类型、层级、锚点、字号锁定及页面尺寸，
    自动整理语义与图文标注分组并保存不可变布局快照，
    在 data.layout_snapshot_path 返回路径供质量反馈使用。
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_ids
    type: array
    required: false
    description: 可选真实元素 ID 数组；省略时读取全部内容元素及地图网格，自动按版式语义名和图文标注分组生成编号映射
  - name: layout_item_ids
    type: object
    required: false
    description: >-
      可选的旧版语义编号映射；省略时自动生成 standard 与 callouts。提供时须与捕获的元素完全一致。快照包含实际毫米矩形、anchor 和 font_locked，并自动保存文件。
execution:
  handler: handlers.layout_advanced.get_items_properties_handler
  param_mapping:
    layout: '{{ layout }}'
    item_ids: '{{ item_ids }}'
    layout_item_ids: '{{ layout_item_ids }}'

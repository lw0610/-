apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_export_svg
  keywords: ["版面矢量图", "输出版面矢量图", "打印版面", "地图排版", "版面元素"]
  display_name: "导出版面矢量图"
  runtime: qgis
  domain: print-layout
spec:
  description: 导出布局为 SVG
  artifacts:
    - {field: artifact_paths, role: deliverable}
    - {field: output, role: deliverable}
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: output
    type: string
    description: 输出路径
  - name: dpi
    type: number
    description: "导出 DPI（像素/英寸，正数）"
  - name: export_as_layers
    type: boolean
    description: 按图层导出
execution:
  handler: handlers.layout_advanced.export_svg_handler
  param_mapping:
    layout: '{{ layout }}'
    output: '{{ output }}'
    dpi: '{{ dpi }}'
    export_as_layers: '{{ export_as_layers }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_export_svg
  display_name: layout_export_svg
  runtime: qgis
  domain: print-layout
spec:
  description: 导出布局为 SVG
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: output
    type: string
    description: 输出路径
  - name: dpi
    type: number
    description: 导出 DPI
  - name: export_as_layers
    type: boolean
    description: 按图层导出
execution:
  handler: handlers.layout_advanced.export_svg_handler
  param_mapping:
    layout: '{{ layout }}'
    output: '{{ output }}'
    dpi: '{{ dpi }}'
    export_as_layers: '{{ export_as_layers }}'

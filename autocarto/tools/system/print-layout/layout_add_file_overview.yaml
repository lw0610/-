apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_add_file_overview
  display_name: layout_add_file_overview
  runtime: qgis
  domain: print-layout
spec:
  description: 在布局中基于当前文件自动生成并添加综述文本
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: file_path
    type: string
    description: 目标文件路径（可选，不传时自动推断当前文件）
  - name: title
    type: string
    description: 综述标题（可选）
  - name: summary
    type: string
    description: 手动指定综述正文（可选，优先级高于自动摘要）
  - name: x
    type: number
    description: 面板左上角 X 坐标(mm)
  - name: y
    type: number
    description: 面板左上角 Y 坐标(mm)
  - name: width
    type: number
    description: 面板宽度(mm)
  - name: height
    type: number
    description: 面板高度(mm)
  - name: label_item_id
    type: string
    description: 综述文本元素 ID
  - name: font_family
    type: string
    description: 综述文字字体
  - name: font_size
    type: integer
    description: 综述文字字号
  - name: font_color
    type: string
    description: 综述文字颜色
  - name: background_color
    type: string
    description: 文本背景颜色
  - name: frame_color
    type: string
    description: 文本边框颜色
  - name: frame_width
    type: number
    description: 文本边框线宽(mm)
  - name: text_margin
    type: number
    description: 文本内边距(mm)
  - name: replace_existing
    type: boolean
    description: 若同 ID 元素已存在，是否先移除后重建
execution:
  handler: handlers.layout_items.add_file_overview_to_layout_handler
  param_mapping:
    layout: '{{ layout }}'
    file_path: '{{ file_path }}'
    title: '{{ title }}'
    summary: '{{ summary }}'
    x: '{{ x }}'
    y: '{{ y }}'
    width: '{{ width }}'
    height: '{{ height }}'
    label_item_id: '{{ label_item_id }}'
    font_family: '{{ font_family }}'
    font_size: '{{ font_size }}'
    font_color: '{{ font_color }}'
    background_color: '{{ background_color }}'
    frame_color: '{{ frame_color }}'
    frame_width: '{{ frame_width }}'
    text_margin: '{{ text_margin }}'
    replace_existing: '{{ replace_existing }}'

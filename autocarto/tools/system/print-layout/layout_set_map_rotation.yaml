apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_set_map_rotation
  keywords: ["地图框旋转角度", "配置地图框旋转角度", "打印版面", "地图排版", "版面元素"]
  display_name: "设置地图框旋转角度"
  runtime: qgis
  domain: print-layout
spec:
  description: 设置地图框旋转
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 地图框ID
  - name: rotation
    type: number
    required: true
    description: "地图旋转角度（度）"
execution:
  handler: handlers.layout_advanced.set_map_rotation_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    rotation: '{{ rotation }}'

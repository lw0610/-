apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_set_map_layers
  keywords: ["地图框图层", "配置地图框图层", "打印版面", "地图排版", "版面元素"]
  display_name: "设置地图框图层"
  runtime: qgis
  domain: print-layout
spec:
  description: 设置地图框图层列表
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 地图框ID
  - name: layers
    type: array
    required: true
    description: 图层ID或唯一名称数组，按从上到下顺序锁定本地图框显示图层，不改变画布和图层面板；同名图层必须使用ID
execution:
  handler: handlers.layout_advanced.set_map_layers_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    layers: '{{ layers }}'

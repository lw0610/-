apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_compose
  display_name: 按版式一次排版
  keywords: [版式, 页面编排, 主图, 标题, 综述, 图例, 比例尺, 指北针, 锚点]
  runtime: qgis
  domain: print-layout
spec:
  description: 按内置或自定义版式一次创建完整打印版面，保持图层顺序和主图框尺寸，按实际元素大小对齐并返回遮挡和页面边界警告。
  parameters:
  - {name: layout, type: string, required: true, description: 版面名称；默认替换已有同名版面}
  - {name: spec, type: resource, resource_type: layout, required: true, description: 版面资源的名称、编号或路径，自动识别声明式版面或 QPT}
  - {name: paper, type: string, description: A0 至 A4 或宽x高（毫米）；默认取版式}
  - {name: orientation, type: string, enum: [landscape, portrait], description: 纸张方向；默认取版式}
  - {name: title, type: string, required: true, description: 标题正文；按版式字号和字重添加}
  - {name: overview_text, type: string, description: 综述正文；省略时不添加可选综述}
  - {name: overview_title, type: string, description: 可选综述标题；同框按综述标题字号显示}
  - {name: map_layers, type: array, items: {type: string}, description: 主图图层名称或 ID，按从上到下顺序；省略时使用可见图层}
  - {name: extent_layers, type: array, items: {type: string}, description: 用于确定范围的图层，与 extent 二选一}
  - {name: extent, type: object, description: 显式范围 xmin/ymin/xmax/ymax/crs，与 extent_layers 二选一}
  - {name: padding, type: number, default: 0.03, description: 范围外扩比例，0 至 1；不改变主图框尺寸}
  - {name: legend_layers, type: array, items: {type: string}, description: 图例白名单图层；省略时使用主图图层}
  - {name: legend_title, type: string, default: 图例, description: 原生图例标题}
  - {name: legend_symbols, type: string, description: 额外图例使用的符号预设名称（军标、图例或用户预设）}
  - {name: legend_extra_items, type: array, items: {type: object}, description: 额外图例条目数组，每项为 label、symbol_type 或 image_path、可选 size_mm；symbol_type 从 legend_symbols 选择}
  - {name: elements, type: object, description: 元素语义名到开关值的对象，例如关闭 grid、border；不能关闭主图}
  - {name: overview_max_width_ratio, type: number, description: 覆盖综述相对主图的最大宽度比例，大于 0 且不超过 1}
  - {name: replace_existing, type: boolean, default: true, description: 是否替换同名版面；false 时保留原版面并报错}
execution:
  handler: handlers.layout_compose.compose_layout_handler
  param_mapping:
    layout: '{{ layout }}'
    spec: '{{ spec }}'
    paper: '{{ paper }}'
    orientation: '{{ orientation }}'
    title: '{{ title }}'
    overview_text: '{{ overview_text }}'
    overview_title: '{{ overview_title }}'
    map_layers: '{{ map_layers }}'
    extent_layers: '{{ extent_layers }}'
    extent: '{{ extent }}'
    padding: '{{ padding }}'
    legend_layers: '{{ legend_layers }}'
    legend_title: '{{ legend_title }}'
    legend_extra_items: '{{ legend_extra_items }}'
    legend_symbols: '{{ legend_symbols }}'
    elements: '{{ elements }}'
    overview_max_width_ratio: '{{ overview_max_width_ratio }}'
    replace_existing: '{{ replace_existing }}'

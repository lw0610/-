apiVersion: tool/v1
kind: Tool
metadata:
  name: export_print_layout
  keywords: ["版面图片", "输出版面图片", "打印版面", "地图排版", "版面元素"]
  display_name: "导出版面图片"
  runtime: qgis
  domain: print-layout
spec:
  description: 导出布局为图片
  artifacts:
    - {field: artifact_paths, role: deliverable}
    - {field: output, role: deliverable}
  parameters:
  - name: LAYOUT
    type: string
    description: 布局名称（大写参数，兼容旧调用）
  - name: layout
    type: string
    description: 布局名称（推荐使用）
  - name: OUTPUT
    type: string
    description: 输出图片路径（大写参数，兼容旧调用）
  - name: output
    type: string
    description: 输出图片路径（推荐使用）
  - name: DPI
    type: number
    description: "导出分辨率（大写参数，兼容旧调用）（像素/英寸，正数）"
  - name: dpi
    type: number
    description: "导出分辨率（推荐使用）（像素/英寸，正数）"
execution:
  handler: handlers.layout_export.export_print_layout_handler
  param_mapping:
    LAYOUT: '{{ LAYOUT }}'
    layout: '{{ layout }}'
    OUTPUT: '{{ OUTPUT }}'
    output: '{{ output }}'
    DPI: '{{ DPI }}'
    dpi: '{{ dpi }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_set_label_style
  keywords: ["文本标签样式", "配置文本标签样式", "打印版面", "地图排版", "版面元素"]
  display_name: "设置文本标签样式"
  runtime: qgis
  domain: print-layout
spec:
  description: 设置标签样式
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 标签ID
  - name: text
    type: string
    description: 文本内容
  - name: font_family
    type: string
    description: 字体
  - name: font_size
    type: number
    description: 字号(mm)
  - name: font_bold
    type: boolean
    description: 加粗
  - name: font_color
    type: string
    description: 字体颜色
  - name: background_color
    type: string
    description: 背景颜色
  - name: frame_enabled
    type: boolean
    description: 是否启用边框
  - name: frame_color
    type: string
    description: 边框颜色
  - name: frame_width
    type: number
    description: "边框线宽（毫米，非负）"
  - name: width
    type: number
    description: 换行参考宽度(mm)
  - name: unlock_font
    type: boolean
    required: false
    description: 本次调用是否明确允许修改版式锁定的字号；默认不允许，其他文字样式仍可修改
execution:
  handler: handlers.layout_advanced.set_label_style_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    text: '{{ text }}'
    font_family: '{{ font_family }}'
    font_size: '{{ font_size }}'
    font_bold: '{{ font_bold }}'
    font_color: '{{ font_color }}'
    background_color: '{{ background_color }}'
    frame_enabled: '{{ frame_enabled }}'
    frame_color: '{{ frame_color }}'
    frame_width: '{{ frame_width }}'
    width: '{{ width }}'
    unlock_font: '{{ unlock_font }}'

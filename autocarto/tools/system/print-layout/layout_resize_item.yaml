apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_resize_item
  keywords: ["版面元素尺寸", "调整版面元素尺寸", "打印版面", "地图排版", "版面元素"]
  display_name: "调整版面元素尺寸"
  runtime: qgis
  domain: print-layout
spec:
  description: 调整布局元素大小；返回 data.rect_mm 为 QGIS 实际尺寸，auto_adjusted 表示实际尺寸与请求不一致
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 元素ID
  - name: width
    type: number
    required: true
    description: 新宽度(mm)
  - name: height
    type: number
    required: true
    description: 新高度(mm)
  - name: container_item_id
    type: string
    required: false
    description: 可选容器真实编号，或 page 表示所在页面；提供时完整矩形必须同时位于容器和页面内，否则拒绝并返回越界边
execution:
  handler: handlers.layout_items.resize_item_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    width: '{{ width }}'
    height: '{{ height }}'
    container_item_id: '{{ container_item_id }}'

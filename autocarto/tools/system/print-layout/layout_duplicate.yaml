apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_duplicate
  keywords: ["打印版面", "复制打印版面", "地图排版", "版面元素"]
  display_name: "复制打印版面"
  runtime: qgis
  domain: print-layout
spec:
  description: 复制打印布局
  parameters:
  - name: source
    type: string
    required: true
    description: 源布局名称
  - name: target
    type: string
    required: true
    description: 目标布局名称
execution:
  handler: handlers.layout.duplicate_layout_handler
  param_mapping:
    source: '{{ source }}'
    target: '{{ target }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_info
  display_name: layout_info
  runtime: qgis
  domain: print-layout
spec:
  description: 获取布局详细信息
  parameters:
  - name: name
    type: string
    required: true
    description: 布局名称
execution:
  handler: handlers.layout.get_layout_info_handler
  param_mapping:
    name: '{{ name }}'

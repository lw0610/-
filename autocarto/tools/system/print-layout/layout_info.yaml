apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_info
  keywords: ["版面信息", "查询版面信息", "打印版面", "地图排版", "版面元素"]
  display_name: "读取版面信息"
  runtime: qgis
  domain: print-layout
spec:
  description: 获取布局详细信息
  parameters:
  - name: name
    type: string
    required: true
    description: 布局名称
execution:
  handler: handlers.layout.get_layout_info_handler
  param_mapping:
    name: '{{ name }}'

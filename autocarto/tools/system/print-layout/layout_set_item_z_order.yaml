apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_set_item_z_order
  keywords: ["元素叠放层级", "配置元素叠放层级", "打印版面", "地图排版", "版面元素"]
  display_name: "设置元素叠放层级"
  runtime: qgis
  domain: print-layout
spec:
  description: 设置布局元素层级
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 元素ID
  - name: z_order
    type: number
    required: true
    description: "叠放层级（无单位；值越大越靠上）"
execution:
  handler: handlers.layout_advanced.set_item_z_order_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    z_order: '{{ z_order }}'

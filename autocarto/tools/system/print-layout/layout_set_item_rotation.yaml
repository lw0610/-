apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_set_item_rotation
  keywords: ["元素旋转角度", "配置元素旋转角度", "打印版面", "地图排版", "版面元素"]
  display_name: "设置元素旋转角度"
  runtime: qgis
  domain: print-layout
spec:
  description: 设置布局元素旋转角度
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 元素ID
  - name: rotation
    type: number
    required: true
    description: "顺时针旋转角度（度）"
execution:
  handler: handlers.layout_advanced.set_item_rotation_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    rotation: '{{ rotation }}'

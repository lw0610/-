apiVersion: tool/v1
kind: Tool
metadata:
  name: layout_set_legend_style
  keywords: ["图例样式", "配置图例样式", "打印版面", "地图排版", "版面元素"]
  display_name: "设置图例样式"
  runtime: qgis
  domain: print-layout
spec:
  description: 设置图例样式、显示图层及图例专用名称；内容或字号变化后保持原有锚点位置。
  parameters:
  - name: layout
    type: string
    required: true
    description: 布局名称
  - name: item_id
    type: string
    required: true
    description: 图例ID
  - name: title
    type: string
    description: 图例标题
  - name: title_font_family
    type: string
    description: 图例标题字体
  - name: title_font_size
    type: number
    description: 图例标题字号(mm)
  - name: body_font_family
    type: string
    description: 图例正文字体
  - name: body_font_size
    type: number
    description: 图例正文字号(mm)
  - name: content_margin
    type: number
    description: "图例内容边距（毫米，非负）"
  - name: background_enabled
    type: boolean
    description: 是否启用背景
  - name: background_color
    type: string
    description: 背景颜色
  - name: frame_color
    type: string
    description: 边框颜色
  - name: frame_width
    type: number
    description: "边框线宽（毫米，非负）"
  - name: symbol_size
    type: number
    description: 图例符号尺寸(mm)
  - name: legend_layers
    type: array
    items:
      type: string
    description: 图例显示图层ID或唯一名称数组；按此顺序重建图例，可恢复先前隐藏的图层。省略时保留当前图层，空数组清空。
  - name: legend_symbols
    type: string
    description: 额外图例使用的符号预设名称（军标、图例或用户预设）
  - name: legend_labels
    type: object
    description: 图层 ID 或唯一名称到图例显示名的映射；符号复用真实图层，不改工程图层名。省略保留已有名称，空对象恢复图层原名。同类路线可只在 legend_layers 中选一个代表图层。
  - name: unlock_font
    type: boolean
    required: false
    description: 本次调用是否明确允许修改版式锁定的字号；默认不允许，其他文字样式仍可修改
  - name: legend_extra_items
    type: array
    required: false
    description: 额外示意条目数组，每项含 label、symbol_type 或 image_path、可选 size_mm；symbol_type 从 legend_symbols 选择；图片支持 SVG、PNG、JPEG，路径按项目根解析；空数组清空额外条目，省略保留通用条目
execution:
  handler: handlers.layout_advanced.set_legend_style_handler
  param_mapping:
    layout: '{{ layout }}'
    item_id: '{{ item_id }}'
    title: '{{ title }}'
    title_font_family: '{{ title_font_family }}'
    title_font_size: '{{ title_font_size }}'
    body_font_family: '{{ body_font_family }}'
    body_font_size: '{{ body_font_size }}'
    content_margin: '{{ content_margin }}'
    background_enabled: '{{ background_enabled }}'
    background_color: '{{ background_color }}'
    frame_color: '{{ frame_color }}'
    frame_width: '{{ frame_width }}'
    symbol_size: '{{ symbol_size }}'
    legend_layers: '{{ legend_layers }}'
    legend_labels: '{{ legend_labels }}'
    legend_symbols: '{{ legend_symbols }}'
    unlock_font: '{{ unlock_font }}'
    legend_extra_items: '{{ legend_extra_items }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: pyqgis_submit_script
  domain: pyqgis-scripting
  runtime: qgis
spec:
  description: 异步提交 PyQGIS 脚本，立即返回任务ID，不等待执行完成。适用于长时间运行的任务
  parameters:
    - name: script
      type: string
      required: true
      description: PyQGIS 脚本代码
    - name: timeout
      type: number
      description: 超时时间（秒），默认300秒
      default: 300
execution:
  handler: handlers.tools.pyqgis_submit_script
  param_mapping:
    script: '{{ script }}'
    timeout: '{{ timeout }}'

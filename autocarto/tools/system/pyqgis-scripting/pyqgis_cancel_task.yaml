apiVersion: tool/v1
kind: Tool
metadata:
  name: pyqgis_cancel_task
  display_name: "取消脚本任务"
  keywords: ["脚本任务", "取消脚本任务", "地图脚本", "脚本执行"]
  domain: pyqgis-scripting
  runtime: qgis
spec:
  description: 取消正在执行的脚本任务
  parameters:
    - name: task_id
      type: string
      required: true
      description: 任务ID
execution:
  handler: handlers.tools.pyqgis_cancel_task
  param_mapping:
    task_id: '{{ task_id }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: admin_boundary_extract
  display_name: 提取行政区边界
  keywords: [行政区边界, 省市县, 边界提取, 行政区代码]
  domain: admin-boundaries
  runtime: qgis
spec:
  description: >-
    按省、市、县级别和精确名称或六位代码，从已校验的内置离线资源提取目标行政区面，默认加载并显示到地图。
    重名返回候选，不取第一条；保留原坐标与属性，输出 GeoJSON 和来源记录，相同调用复用结果。
  parameters:
    - name: level
      type: string
      required: true
      enum: [省, 市, 县, province, city, county]
      description: 行政区级别，省/province、市/city或县/county
    - name: name
      type: string
      description: 行政区精确全名，与 code 至少提供一个；重名时根据候选改用代码
    - name: code
      type: string
      description: 六位行政区代码字符串，与 name 同时提供时必须同时匹配
    - name: within
      type: string
      description: 提取某上级区域下全部指定级别面；全国、上级全名或六位代码。与 name/code 互斥。
    - name: load
      type: boolean
      default: true
      description: 是否加载提取结果，默认加载并显示；false 仅写出文件。
    - {name: show, type: boolean, default: true, description: load=true 时默认显示到地图；仅作计算输入时明确传 false 留在后台}
    - name: output
      type: string
      description: 可选 .geojson 输出文件路径，相对路径按项目根解析；默认项目运行数据目录的 data/boundaries，已有不同内容不会覆盖
execution:
  handler: handlers.boundary.extract_boundary_handler
  param_mapping:
    level: '{{ level }}'
    name: '{{ name }}'
    code: '{{ code }}'
    output: '{{ output }}'
    within: '{{ within }}'
    load: '{{ load }}'
    show: '{{ show }}'

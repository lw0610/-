apiVersion: tool/v1
kind: Tool
metadata:
  name: hillshade
  keywords: ["山体阴影", "分析山体阴影", "栅格分析", "地形分析", "空间插值"]
  display_name: "计算山体阴影"
  domain: raster-analysis
  runtime: qgis
spec:
  description: 计算DEM的山体阴影
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入DEM
  - name: Z_FACTOR
    type: number
    description: "Z因子（垂直方向换算系数，无单位，正数）"
    default: 1.0
  - name: AZIMUTH
    type: number
    description: "方位角（度）"
    default: 315.0
  - name: V_ANGLE
    type: number
    description: "垂直角度（度）"
    default: 45.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: native:hillshade
  param_mapping:
    INPUT: '{{ INPUT }}'
    Z_FACTOR: '{{ Z_FACTOR }}'
    AZIMUTH: '{{ AZIMUTH }}'
    V_ANGLE: '{{ V_ANGLE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

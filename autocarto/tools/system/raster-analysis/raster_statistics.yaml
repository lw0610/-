apiVersion: tool/v1
kind: Tool
metadata:
  name: raster_statistics
  keywords: ["栅格数值", "统计栅格数值", "栅格分析", "地形分析", "空间插值"]
  display_name: "统计栅格数值"
  domain: raster-analysis
  runtime: qgis
spec:
  description: 计算栅格图层统计信息
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入栅格
  - name: BAND
    type: integer
    description: "波段号（从 1 开始的波段序号）"
    default: 1
execution:
  backend_tool: raster_statistics
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'

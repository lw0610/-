apiVersion: tool/v1
kind: Tool
metadata:
  name: heatmap
  keywords: ["核密度热力图", "分析核密度热力图", "栅格分析", "地形分析", "空间插值"]
  display_name: "计算核密度热力图"
  domain: raster-analysis
  runtime: qgis
spec:
  description: 核密度估计热力图
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入点图层
  - name: RADIUS
    type: number
    required: true
    description: "搜索半径（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
  - name: PIXEL_SIZE
    type: number
    description: "像素大小（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 0.1
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: qgis:heatmapkerneldensityestimation
  param_mapping:
    INPUT: '{{ INPUT }}'
    RADIUS: '{{ RADIUS }}'
    PIXEL_SIZE: '{{ PIXEL_SIZE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

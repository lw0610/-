apiVersion: tool/v1
kind: Tool
metadata:
  name: heatmap
  display_name: 热力图
  domain: raster-analysis
  runtime: qgis
spec:
  description: 核密度估计热力图
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入点图层
  - name: RADIUS
    type: number
    required: true
    description: 搜索半径
  - name: PIXEL_SIZE
    type: number
    description: 像素大小
    default: 0.1
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: heatmap
  param_mapping:
    INPUT: '{{ INPUT }}'
    RADIUS: '{{ RADIUS }}'
    PIXEL_SIZE: '{{ PIXEL_SIZE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: create_constant_raster
  keywords: ["常量栅格", "生成常量栅格", "栅格分析", "地形分析", "空间插值"]
  display_name: "创建常量栅格"
  domain: raster-analysis
  runtime: qgis
spec:
  description: 创建具有固定值的栅格图层
  parameters:
  - name: EXTENT
    type: extent
    required: true
    description: 输出范围
  - name: TARGET_CRS
    type: crs
    required: true
    description: 目标坐标系
  - name: PIXEL_SIZE
    type: number
    required: true
    description: "像素大小（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 1.0
  - name: NUMBER
    type: number
    required: true
    description: "栅格固定数值（数值单位由数据含义决定）"
    default: 1
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: create_constant_raster
  param_mapping:
    EXTENT: '{{ EXTENT }}'
    TARGET_CRS: '{{ TARGET_CRS }}'
    PIXEL_SIZE: '{{ PIXEL_SIZE }}'
    NUMBER: '{{ NUMBER }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: aspect
  keywords: ["地形坡向", "分析地形坡向", "栅格分析", "地形分析", "空间插值"]
  display_name: "计算地形坡向"
  domain: raster-analysis
  runtime: qgis
spec:
  description: 计算DEM的坡向
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入DEM
  - name: Z_FACTOR
    type: number
    description: "Z因子（垂直方向换算系数，无单位，正数）"
    default: 1.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: aspect
  param_mapping:
    INPUT: '{{ INPUT }}'
    Z_FACTOR: '{{ Z_FACTOR }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: create_random_raster_uniform
  display_name: 创建随机栅格图层(均匀分布)
  domain: raster-analysis
  runtime: qgis
spec:
  description: 创建均匀分布的随机栅格
  parameters:
  - name: EXTENT
    type: extent
    required: true
    description: 输出范围
  - name: TARGET_CRS
    type: crs
    required: true
    description: 目标坐标系
  - name: PIXEL_SIZE
    type: number
    description: 像素大小
    default: 1.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: create_random_raster_uniform
  param_mapping:
    EXTENT: '{{ EXTENT }}'
    TARGET_CRS: '{{ TARGET_CRS }}'
    PIXEL_SIZE: '{{ PIXEL_SIZE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

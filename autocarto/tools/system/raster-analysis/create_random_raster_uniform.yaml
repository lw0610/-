apiVersion: tool/v1
kind: Tool
metadata:
  name: create_random_raster_uniform
  keywords: ["均匀随机栅格", "生成均匀随机栅格", "栅格分析", "地形分析", "空间插值"]
  display_name: "创建均匀随机栅格"
  domain: raster-analysis
  runtime: qgis
spec:
  description: 创建均匀分布的随机栅格
  parameters:
  - name: EXTENT
    type: extent
    required: true
    description: 输出范围
  - name: TARGET_CRS
    type: crs
    required: true
    description: 目标坐标系
  - name: PIXEL_SIZE
    type: number
    description: "像素大小（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 1.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: native:createrandomuniformrasterlayer
  param_mapping:
    EXTENT: '{{ EXTENT }}'
    TARGET_CRS: '{{ TARGET_CRS }}'
    PIXEL_SIZE: '{{ PIXEL_SIZE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: resource_get
  display_name: 查看资源
  domain: runtime-control
  runtime: internal
  keywords: [样式, 版面, 资源名称, 资源编号]
spec:
  description: 按名称或编号查看模板与样式库中的样式或版面。此工具不查询史料、附件、用户文件夹或制图数据；读取这些材料使用 file_read、file_list 或 document_extract，查找制图数据使用 data_find。
  parameters:
    - name: name
      type: string
      required: true
      description: 模板与样式库中已有的样式或版面名称、编号。
    - name: type
      type: string
      description: 可选样式或版面类型（style、layout）；不指定时在模板与样式库中按名称匹配。
    - name: offset
      type: integer
      default: 0
      description: 条目起始位置，从0开始。
    - name: limit
      type: integer
      default: 200
      description: 本页最多条目数，范围1至1000。
execution:
  backend_tool: resource_get
  param_mapping:
    name: '{{ name }}'
    type: '{{ type }}'
    offset: '{{ offset }}'
    limit: '{{ limit }}'

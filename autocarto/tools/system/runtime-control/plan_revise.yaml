apiVersion: tool/v1
kind: Tool
metadata:
  name: plan_revise
  display_name: 修订制图计划
  domain: runtime-control
  runtime: internal
  keywords: [制图, 计划, 指南]
spec:
  description: |
    提交 carto-plan/v2 计划。系统自动生成编号和版本、对齐引用、预检数据、在消费前准备数据。
    source 四选一 user/project/builtin/retrieve；用户ref为路径、附件:名称、消息原文或会话文件ID。
    retrieve 的need写category、params、fields、description；统计表写region、level、year、indicator、caliber、unit；用户排除的行政单元写exclude。
    extent写region、bbox[西南东北]或from:前序数据/产出ID与expand:0.2。method仅用户明确指定。
    步骤role_hint从当前方案roles目录选择实际子智能体ID；按其职责安排工作，使用该角色已有的模型、提示词和工具，不创建临时角色或填写工具包清单。
    步骤inputs引用data.id或前序produces.id；每步必须声明至少一个produces，无须在data中重复声明步骤产出。
    produces.kind=layout 表示工程中的版面，产出值是版面名称，不填写format；导出PDF或QPT文件则使用kind=file和对应format。
    图片质量初审与终审分别用produces.kind=review_initial/review_final；导出PNG/PDF文件仍用file，不自动要求审图。
    文字报告用produces.kind=text；用户确认结果用confirmation。没有待处理项时省略无操作步骤，或用text如实报告零项，不声明不存在的图层或文件。
    不写find_id/choice/from/uses/outputs，不创建acquire步骤。已完成成果直接引用，不重复生产。
    修订时提交完整计划，系统保留已完成步骤；plan_id可填当前计划ID，版本由系统增加。
    示例（假定当前方案有 cartographer 子智能体）：{"goal":"根据本地数据制作专题图并导出PDF","data":[{"id":"src","name":"专题数据","kind":"layer","source":"user","ref":"附件:专题数据.geojson"}],"steps":[{"id":"draw","title":"制图并导出","role_hint":"cartographer","inputs":["src"],"instructions":"按用户指定的指标设置颜色、标注和版面并导出PDF","produces":[{"id":"map_pdf","kind":"file","format":"pdf"}]}],"deliverables":["map_pdf"],"checks":["来源与图例正确"]}
  parameters:
  - name: plan
    type: object
    required: true
    description: 目标、数据需求与委派给当前方案子智能体的执行步骤。编号由系统补齐。
    schema:
      type: object
      required: [goal, steps]
      properties:
        goal: {type: string}
        guide: {type: string}
        plan_id: {type: string}
        facts:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              value: {}
              from: {type: string}
        assumptions:
          type: array
          items:
            type: object
            properties:
              text: {type: string}
              impact: {type: string, enum: [low, high]}
        data:
          type: array
          description: '每项id/name/kind(layer|table|dataset|file)/source/ref/need/extent/method/style/label_field。'
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              kind: {type: string, enum: [layer, table, dataset, file]}
              source: {type: string, enum: [user, project, builtin, retrieve]}
              ref:
                type: string
                description: 用户数据路径、附件:名称、消息原文、会话文件ID，或工程图层ID、内置图层名。
              geometry: {type: string, enum: [point, line, polygon, raster, table]}
              style: {type: string}
              label_field: {type: string}
              method:
                type: string
                description: 仅用户明确指定获取方式时填写。
              need:
                type: object
                properties:
                  category: {type: string}
                  params: {type: object}
                  fields: {type: array, items: {type: string}}
                  description: {type: string}
                  region: {type: string}
                  level: {type: string}
                  year: {type: integer}
                  indicator: {type: string}
                  caliber: {type: string}
                  unit: {type: string}
                  exclude:
                    type: array
                    description: 用户明确排除的行政单元代码或完整名称。
                    items: {type: string}
              extent:
                type: object
                properties:
                  region: {type: string}
                  bbox:
                    type: array
                    description: 西、南、东、北四个经纬度数值。
                    items: {type: number}
                  from:
                    type: string
                    description: 前序数据或步骤产出ID。
                  expand: {type: number}
        steps:
          type: array
          description: '每项id/title/role_hint/inputs/instructions/parameters/produces[{id,kind,format}]/optional；role_hint与produces必填，produces至少一项。'
          items:
            type: object
            required: [role_hint, produces]
            properties:
              id: {type: string}
              title: {type: string}
              role_hint:
                type: string
                description: 当前方案roles目录中的子智能体ID，按职责选择，不填写主智能体或临时角色。
              inputs:
                type: array
                description: 引用data.id或前序步骤的produces.id。
                items: {type: string}
              instructions: {type: string}
              parameters:
                type: object
                description: '可选。仅用户明确指定使用路线样式表或符号表时，才填写 route_style 或 symbols 的预设名称；否则省略，使用原版内置绘制规则。配色要求不等于选用样式表。'
                additionalProperties: {type: string}
              produces:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    kind: {type: string, enum: [layer, table, dataset, file, layout, review_initial, review_final, text, confirmation]}
                    format:
                      type: string
                      description: '文件格式如pdf/qpt，数据集格式如route_dataset；layout是工程版面，不填写format。'
                    geometry: {type: string, enum: [point, line, polygon, raster, table]}
                    fields: {type: array, items: {type: string}}
              optional: {type: boolean}
        deliverables:
          type: array
          items: {type: string}
        checks:
          type: array
          items: {type: string}
execution:
  backend_tool: plan_revise
  param_mapping:
    plan: '{{ plan }}'

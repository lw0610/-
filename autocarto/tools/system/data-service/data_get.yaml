apiVersion: tool/v1
kind: Tool
metadata:
  name: data_get
  display_name: 获取已选数据
  domain: data-service
  runtime: internal
spec:
  description: 方案中的数据角色使用当前会话 data_find 查询与真实候选获取数据。确定性来源直接获取并核验；需要继续探索时返回 exploration_required 和 preparation，由同一角色沿用 find_id 和 preparation，使用已分配工具获取原件并以 data_register 登记。计划执行器已绑定来源时无需再次调用。
  parameters:
    - name: find_id
      type: string
      required: true
      description: 本次data_find的查询编号。未绑定查询有效期30分钟；已冻结的计划或中断恢复沿用原编号。
    - name: choice
      type: object
      required: true
      description: 按行选择候选编号；星号键recommended表示其他行采用推荐。
    - name: target
      type: object
      required: false
      description: 可提供folder_name，只能为单个文件夹名。
execution:
  backend_tool: data_get
  param_mapping:
    find_id: '{{ find_id }}'
    choice: '{{ choice }}'
    target: '{{ target }}'

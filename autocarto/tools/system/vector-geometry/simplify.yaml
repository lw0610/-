apiVersion: tool/v1
kind: Tool
metadata:
  name: simplify
  keywords: ["要素几何", "简化要素几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "简化要素几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 简化几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: METHOD
    type: enum
    description: 简化方法
    default: 0
    values:
    - 0
    - 1
    - 2
  - name: TOLERANCE
    type: number
    description: "容差（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: simplify
  param_mapping:
    INPUT: '{{ INPUT }}'
    METHOD: '{{ METHOD }}'
    TOLERANCE: '{{ TOLERANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: simplify
  display_name: 简化
  domain: vector-geometry
  runtime: qgis
spec:
  description: 简化几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: METHOD
    type: enum
    description: 简化方法
    default: 0
    values:
    - 0
    - 1
    - 2
  - name: TOLERANCE
    type: number
    description: 容差
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: simplify
  param_mapping:
    INPUT: '{{ INPUT }}'
    METHOD: '{{ METHOD }}'
    TOLERANCE: '{{ TOLERANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

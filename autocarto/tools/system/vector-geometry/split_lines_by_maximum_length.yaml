apiVersion: tool/v1
kind: Tool
metadata:
  name: split_lines_by_maximum_length
  display_name: 按最大长度分割线
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按最大长度分割线要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: LENGTH
    type: number
    description: 最大长度
    default: 10.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: split_lines_by_maximum_length
  param_mapping:
    INPUT: '{{ INPUT }}'
    LENGTH: '{{ LENGTH }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: smooth
  keywords: ["要素几何", "平滑要素几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "平滑要素几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 平滑几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: ITERATIONS
    type: integer
    description: "迭代次数（数量，正整数）"
    default: 1
  - name: OFFSET
    type: number
    description: "平滑偏移比例（无单位，0—0.5）"
    default: 0.25
  - name: MAX_ANGLE
    type: number
    description: "需要平滑的最大拐角（度，0—180）"
    default: 180.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: smooth
  param_mapping:
    INPUT: '{{ INPUT }}'
    ITERATIONS: '{{ ITERATIONS }}'
    OFFSET: '{{ OFFSET }}'
    MAX_ANGLE: '{{ MAX_ANGLE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

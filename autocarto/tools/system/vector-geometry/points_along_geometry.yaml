apiVersion: tool/v1
kind: Tool
metadata:
  name: points_along_geometry
  display_name: 沿几何图形的点
  domain: vector-geometry
  runtime: qgis
spec:
  description: 沿线创建等距点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: DISTANCE
    type: number
    description: 距离
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: points_along_geometry
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

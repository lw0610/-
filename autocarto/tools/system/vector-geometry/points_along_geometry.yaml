apiVersion: tool/v1
kind: Tool
metadata:
  name: points_along_geometry
  keywords: ["何生成等距点", "沿几何生成等距点", "几何处理", "空间叠加", "几何修复"]
  display_name: "沿几何生成等距点"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 沿线创建等距点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: DISTANCE
    type: number
    description: "距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: points_along_geometry
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

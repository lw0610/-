apiVersion: tool/v1
kind: Tool
metadata:
  name: translate_geometry
  display_name: 平移几何图形
  domain: vector-geometry
  runtime: qgis
spec:
  description: 平移几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: DELTA_X
    type: number
    description: X偏移量
    default: 0.0
  - name: DELTA_Y
    type: number
    description: Y偏移量
    default: 0.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: translate_geometry
  param_mapping:
    INPUT: '{{ INPUT }}'
    DELTA_X: '{{ DELTA_X }}'
    DELTA_Y: '{{ DELTA_Y }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: merge_lines
  keywords: ["相接线段", "合并相接线段", "几何处理", "空间叠加", "几何修复"]
  display_name: "合并相接线段"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 合并连接的线要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: merge_lines
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

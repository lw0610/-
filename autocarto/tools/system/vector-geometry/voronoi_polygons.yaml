apiVersion: tool/v1
kind: Tool
metadata:
  name: voronoi_polygons
  display_name: 泰森多边形
  domain: vector-geometry
  runtime: qgis
spec:
  description: 创建泰森多边形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: BUFFER
    type: number
    description: 缓冲区百分比
    default: 0.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: voronoi_polygons
  param_mapping:
    INPUT: '{{ INPUT }}'
    BUFFER: '{{ BUFFER }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

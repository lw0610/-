apiVersion: tool/v1
kind: Tool
metadata:
  name: voronoi_polygons
  keywords: ["泰森多边形", "生成泰森多边形", "几何处理", "空间叠加", "几何修复"]
  display_name: "创建泰森多边形"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 创建泰森多边形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: BUFFER
    type: number
    description: "输出范围外扩比例（百分比，非负）"
    default: 0.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: voronoi_polygons
  param_mapping:
    INPUT: '{{ INPUT }}'
    BUFFER: '{{ BUFFER }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: snap_geometries_to_layer
  keywords: ["几何到参考图层", "捕捉几何到参考图层", "几何处理", "空间叠加", "几何修复"]
  display_name: "捕捉几何到参考图层"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将几何图形捕捉到参考图层
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: REFERENCE_LAYER
    type: layer
    required: true
    description: 参考图层
  - name: TOLERANCE
    type: number
    description: "容差（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 10.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: snap_geometries_to_layer
  param_mapping:
    INPUT: '{{ INPUT }}'
    REFERENCE_LAYER: '{{ REFERENCE_LAYER }}'
    TOLERANCE: '{{ TOLERANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

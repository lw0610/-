apiVersion: tool/v1
kind: Tool
metadata:
  name: coverage_simplify
  keywords: ["面覆盖几何", "简化面覆盖几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "简化面覆盖几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 简化Coverage几何图形同时保持拓扑关系
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: TOLERANCE
    type: number
    required: true
    description: "简化容差（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: coverage_simplify
  param_mapping:
    INPUT: '{{ INPUT }}'
    TOLERANCE: '{{ TOLERANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

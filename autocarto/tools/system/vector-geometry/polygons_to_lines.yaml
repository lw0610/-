apiVersion: tool/v1
kind: Tool
metadata:
  name: polygons_to_lines
  keywords: ["多边形为线", "转为多边形为线", "几何处理", "空间叠加", "几何修复"]
  display_name: "转换多边形为线"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将多边形转换为线要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: polygons_to_lines
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

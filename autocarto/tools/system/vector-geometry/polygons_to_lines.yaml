apiVersion: tool/v1
kind: Tool
metadata:
  name: polygons_to_lines
  display_name: 多边形转线
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将多边形转换为线要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: polygons_to_lines
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

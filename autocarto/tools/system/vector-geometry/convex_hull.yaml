apiVersion: tool/v1
kind: Tool
metadata:
  name: convex_hull
  display_name: 凸包
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算要素的凸包
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: convex_hull
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

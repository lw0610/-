apiVersion: tool/v1
kind: Tool
metadata:
  name: minimum_enclosing_circle
  display_name: 最小外接圆
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算最小外接圆
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: minimum_enclosing_circle
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

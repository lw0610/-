  keywords: ["最小外接圆", "分析最小外接圆", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算最小外接圆"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算最小外接圆
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer

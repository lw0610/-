apiVersion: tool/v1
kind: Tool
metadata:
  name: coverage_validate
  keywords: ["面覆盖拓扑", "验证面覆盖拓扑", "几何处理", "空间叠加", "几何修复"]
  display_name: "验证面覆盖拓扑"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 验证Coverage的拓扑有效性
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: GAP_WIDTH
    type: number
    description: "间隙宽度阈值（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 0.0
  - name: INVALID_EDGES
    type: output_layer
    description: 无效边输出
execution:
  backend_tool: coverage_validate
  param_mapping:
    INPUT: '{{ INPUT }}'
    GAP_WIDTH: '{{ GAP_WIDTH }}'
    INVALID_EDGES: '{{ INVALID_EDGES }}'
  output:
    auto_load: true

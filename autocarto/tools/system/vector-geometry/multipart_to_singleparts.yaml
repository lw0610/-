apiVersion: tool/v1
kind: Tool
metadata:
  name: multipart_to_singleparts
  display_name: 多部件转单部件
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将多部件要素转换为单部件要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: multipart_to_singleparts
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

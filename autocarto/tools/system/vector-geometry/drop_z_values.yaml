apiVersion: tool/v1
kind: Tool
metadata:
  name: drop_z_values
  keywords: ["高程与测量值", "删除高程与测量值", "几何处理", "空间叠加", "几何修复"]
  display_name: "移除高程与测量值"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 丢弃几何图形的Z和M值
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: DROP_Z_VALUES
    type: boolean
    description: 丢弃Z值
    default: false
  - name: DROP_M_VALUES
    type: boolean
    description: 丢弃M值
    default: false
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: drop_z_values
  param_mapping:
    INPUT: '{{ INPUT }}'
    DROP_Z_VALUES: '{{ DROP_Z_VALUES }}'
    DROP_M_VALUES: '{{ DROP_M_VALUES }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

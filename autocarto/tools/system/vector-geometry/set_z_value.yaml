apiVersion: tool/v1
kind: Tool
metadata:
  name: set_z_value
  display_name: 设置Z值
  domain: vector-geometry
  runtime: qgis
spec:
  description: 设置几何图形的Z值
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: Z_VALUE
    type: number
    description: Z值
    default: 0.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: set_z_value
  param_mapping:
    INPUT: '{{ INPUT }}'
    Z_VALUE: '{{ Z_VALUE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

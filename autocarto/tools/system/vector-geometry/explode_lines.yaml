apiVersion: tool/v1
kind: Tool
metadata:
  name: explode_lines
  display_name: 分解线
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将线分解为单独的线段
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: explode_lines
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: offset_line
  display_name: 偏移线
  domain: vector-geometry
  runtime: qgis
spec:
  description: 偏移线要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: DISTANCE
    type: number
    description: 偏移距离
    default: 10.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: offset_line
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

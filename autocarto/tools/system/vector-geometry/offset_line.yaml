apiVersion: tool/v1
kind: Tool
metadata:
  name: offset_line
  keywords: ["线条偏移", "生成线条偏移", "几何处理", "空间叠加", "几何修复"]
  display_name: "生成线条偏移"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 偏移线要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: DISTANCE
    type: number
    description: "偏移距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 10.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: offset_line
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

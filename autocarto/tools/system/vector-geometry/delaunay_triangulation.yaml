apiVersion: tool/v1
kind: Tool
metadata:
  name: delaunay_triangulation
  display_name: 德劳内三角剖分
  domain: vector-geometry
  runtime: qgis
spec:
  description: 创建德劳内三角网
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: delaunay_triangulation
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

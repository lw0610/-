apiVersion: tool/v1
kind: Tool
metadata:
  name: lines_to_polygons
  keywords: ["线为多边形", "转为线为多边形", "几何处理", "空间叠加", "几何修复"]
  display_name: "转换线为多边形"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将线要素转换为多边形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: lines_to_polygons
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

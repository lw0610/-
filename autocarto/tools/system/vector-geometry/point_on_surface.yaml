apiVersion: tool/v1
kind: Tool
metadata:
  name: point_on_surface
  keywords: ["面内点", "生成面内点", "几何处理", "空间叠加", "几何修复"]
  display_name: "生成面内点"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 在多边形表面上创建点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: ALL_PARTS
    type: boolean
    description: 为所有部件创建点
    default: false
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: point_on_surface
  param_mapping:
    INPUT: '{{ INPUT }}'
    ALL_PARTS: '{{ ALL_PARTS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

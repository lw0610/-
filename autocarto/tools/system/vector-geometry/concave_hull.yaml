apiVersion: tool/v1
kind: Tool
metadata:
  name: concave_hull
  keywords: ["要素凹包", "分析要素凹包", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算要素凹包"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算凹包
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: ALPHA
    type: number
    description: "凹包阈值（无单位，0—1）"
    default: 0.3
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: concave_hull
  param_mapping:
    INPUT: '{{ INPUT }}'
    ALPHA: '{{ ALPHA }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

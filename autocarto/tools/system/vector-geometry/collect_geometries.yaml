apiVersion: tool/v1
kind: Tool
metadata:
  name: collect_geometries
  display_name: 收集几何图形
  domain: vector-geometry
  runtime: qgis
spec:
  description: 将要素收集为多部件几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD
    type: fields
    description: 分组字段
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: collect_geometries
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

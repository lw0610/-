apiVersion: tool/v1
kind: Tool
metadata:
  name: centroids
  keywords: ["要素质心", "分析要素质心", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算要素质心"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算要素的质心
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: ALL_PARTS
    type: boolean
    description: 为所有部件创建质心
    default: false
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: centroids
  param_mapping:
    INPUT: '{{ INPUT }}'
    ALL_PARTS: '{{ ALL_PARTS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

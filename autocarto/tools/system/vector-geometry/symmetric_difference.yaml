apiVersion: tool/v1
kind: Tool
metadata:
  name: symmetric_difference
  display_name: 对称差集
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算两个图层的对称差集
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OVERLAY
    type: layer
    required: true
    description: 叠加图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: symmetric_difference
  param_mapping:
    INPUT: '{{ INPUT }}'
    OVERLAY: '{{ OVERLAY }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

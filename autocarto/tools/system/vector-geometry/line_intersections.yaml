apiVersion: tool/v1
kind: Tool
metadata:
  name: line_intersections
  display_name: 线交点
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算线要素的交点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: INTERSECT
    type: layer
    required: true
    description: 相交图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: line_intersections
  param_mapping:
    INPUT: '{{ INPUT }}'
    INTERSECT: '{{ INTERSECT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

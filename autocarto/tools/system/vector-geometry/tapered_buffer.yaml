apiVersion: tool/v1
kind: Tool
metadata:
  name: tapered_buffer
  display_name: 锥形缓冲区
  domain: vector-geometry
  runtime: qgis
spec:
  description: 创建锥形缓冲区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: START_WIDTH
    type: number
    description: 起始宽度
    default: 0.0
  - name: END_WIDTH
    type: number
    description: 结束宽度
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: tapered_buffer
  param_mapping:
    INPUT: '{{ INPUT }}'
    START_WIDTH: '{{ START_WIDTH }}'
    END_WIDTH: '{{ END_WIDTH }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

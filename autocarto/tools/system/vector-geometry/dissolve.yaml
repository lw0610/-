apiVersion: tool/v1
kind: Tool
metadata:
  name: dissolve
  display_name: 融合
  domain: vector-geometry
  runtime: qgis
spec:
  description: 融合要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD
    type: fields
    description: 融合字段
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: dissolve
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

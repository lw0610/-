apiVersion: tool/v1
kind: Tool
metadata:
  name: delete_duplicate_geometries
  keywords: ["重复几何", "删除重复几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "删除重复几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 删除重复的几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: delete_duplicate_geometries
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

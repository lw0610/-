apiVersion: tool/v1
kind: Tool
metadata:
  name: extract_specific_vertices
  display_name: 提取特定顶点
  domain: vector-geometry
  runtime: qgis
spec:
  description: 提取指定位置的顶点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: VERTICES
    type: string
    description: 顶点索引
    default: '0'
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: extract_specific_vertices
  param_mapping:
    INPUT: '{{ INPUT }}'
    VERTICES: '{{ VERTICES }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: densify_by_interval
  display_name: 按间隔加密
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按距离间隔加密几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: INTERVAL
    type: number
    description: 间隔距离
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: densify_by_interval
  param_mapping:
    INPUT: '{{ INPUT }}'
    INTERVAL: '{{ INTERVAL }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

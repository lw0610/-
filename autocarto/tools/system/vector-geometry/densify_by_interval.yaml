apiVersion: tool/v1
kind: Tool
metadata:
  name: densify_by_interval
  keywords: ["按距离加密几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "按距离加密几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按距离间隔加密几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: INTERVAL
    type: number
    description: "间隔距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
    default: 1.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: densify_by_interval
  param_mapping:
    INPUT: '{{ INPUT }}'
    INTERVAL: '{{ INTERVAL }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: extract_vertices
  display_name: 提取顶点
  domain: vector-geometry
  runtime: qgis
spec:
  description: 提取几何图形的顶点
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: extract_vertices
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

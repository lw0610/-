apiVersion: tool/v1
kind: Tool
metadata:
  name: minimum_bounding_geometry
  keywords: ["最小包围几何", "分析最小包围几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算最小包围几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算最小边界几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: TYPE
    type: enum
    description: 几何类型
    default: 0
    values:
    - 0
    - 1
    - 2
    - 3
    - 4
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: minimum_bounding_geometry
  param_mapping:
    INPUT: '{{ INPUT }}'
    TYPE: '{{ TYPE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

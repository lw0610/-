apiVersion: tool/v1
kind: Tool
metadata:
  name: check_validity
  keywords: ["几何有效性", "检查几何有效性", "几何处理", "空间叠加", "几何修复"]
  display_name: "检查几何有效性"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 检查几何有效性，返回有效、无效及错误数量，不向工程添加检查图层。需要保留具体要素时指定对应输出文件路径。
  parameters:
  - name: INPUT_LAYER
    type: layer
    required: true
    description: 输入图层
  - name: METHOD
    type: enum
    description: 检查方法
    default: 2
    values:
    - 0
    - 1
    - 2
  - name: VALID_OUTPUT
    type: output_layer
    description: 有效要素输出文件（可选）；省略时仅返回统计，不新增工程图层
  - name: INVALID_OUTPUT
    type: output_layer
    description: 无效要素输出文件（可选）；省略时仅返回统计，不新增工程图层
  - name: ERROR_OUTPUT
    type: output_layer
    description: 错误位置输出文件（可选）；省略时仅返回统计，不新增工程图层
execution:
  backend_tool: check_validity
  param_mapping:
    INPUT_LAYER: '{{ INPUT_LAYER }}'
    METHOD: '{{ METHOD }}'
    VALID_OUTPUT: '{{ VALID_OUTPUT }}'
    INVALID_OUTPUT: '{{ INVALID_OUTPUT }}'
    ERROR_OUTPUT: '{{ ERROR_OUTPUT }}'
  output:
    auto_load: false

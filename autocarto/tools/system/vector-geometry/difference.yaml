apiVersion: tool/v1
kind: Tool
metadata:
  name: difference
  keywords: ["图层差集", "分析图层差集", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算图层差集"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算两个图层的差集
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OVERLAY
    type: layer
    required: true
    description: 叠加图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: difference
  param_mapping:
    INPUT: '{{ INPUT }}'
    OVERLAY: '{{ OVERLAY }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

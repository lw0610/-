apiVersion: tool/v1
kind: Tool
metadata:
  name: densify_by_count
  keywords: ["按顶点数加密几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "按顶点数加密几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按顶点数量加密几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: VERTICES
    type: integer
    description: "顶点数量（数量，正整数）"
    default: 1
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: densify_by_count
  param_mapping:
    INPUT: '{{ INPUT }}'
    VERTICES: '{{ VERTICES }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

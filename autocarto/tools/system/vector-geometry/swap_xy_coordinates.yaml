apiVersion: tool/v1
kind: Tool
metadata:
  name: swap_xy_coordinates
  keywords: ["平面坐标轴", "交换平面坐标轴", "几何处理", "空间叠加", "几何修复"]
  display_name: "交换平面坐标轴"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 交换X和Y坐标
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: swap_xy_coordinates
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

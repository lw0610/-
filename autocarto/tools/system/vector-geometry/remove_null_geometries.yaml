apiVersion: tool/v1
kind: Tool
metadata:
  name: remove_null_geometries
  keywords: ["空几何要素", "删除空几何要素", "几何处理", "空间叠加", "几何修复"]
  display_name: "移除空几何要素"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 移除空的几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: remove_null_geometries
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

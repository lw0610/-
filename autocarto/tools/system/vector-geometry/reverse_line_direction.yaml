apiVersion: tool/v1
kind: Tool
metadata:
  name: reverse_line_direction
  display_name: 反转线方向
  domain: vector-geometry
  runtime: qgis
spec:
  description: 反转线要素的方向
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: reverse_line_direction
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

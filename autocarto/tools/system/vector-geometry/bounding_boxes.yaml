apiVersion: tool/v1
kind: Tool
metadata:
  name: bounding_boxes
  keywords: ["要素边界框", "分析要素边界框", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算要素边界框"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算要素的边界框
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: bounding_boxes
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

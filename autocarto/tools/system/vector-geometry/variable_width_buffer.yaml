apiVersion: tool/v1
kind: Tool
metadata:
  name: variable_width_buffer
  keywords: ["按测量值创建缓冲区", "几何处理", "空间叠加", "几何修复"]
  display_name: "按测量值创建缓冲区"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按M值创建可变宽度缓冲区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: SEGMENTS
    type: integer
    description: "线段数（数量，正整数）"
    default: 16
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: variable_width_buffer
  param_mapping:
    INPUT: '{{ INPUT }}'
    SEGMENTS: '{{ SEGMENTS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: variable_width_buffer
  display_name: 可变宽度缓冲区
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按M值创建可变宽度缓冲区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: SEGMENTS
    type: integer
    description: 线段数
    default: 16
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: variable_width_buffer
  param_mapping:
    INPUT: '{{ INPUT }}'
    SEGMENTS: '{{ SEGMENTS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

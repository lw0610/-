apiVersion: tool/v1
kind: Tool
metadata:
  name: rotate_features
  keywords: ["要素几何", "旋转要素几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "旋转要素几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 旋转要素几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: ANGLE
    type: number
    description: "旋转角度（度）"
    default: 0.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: rotate_features
  param_mapping:
    INPUT: '{{ INPUT }}'
    ANGLE: '{{ ANGLE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

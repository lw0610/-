apiVersion: tool/v1
kind: Tool
metadata:
  name: coverage_union
  display_name: 融合Coverage
  domain: vector-geometry
  runtime: qgis
spec:
  description: 融合Coverage中的所有几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: coverage_union
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: clip
  display_name: 裁剪
  domain: vector-geometry
  runtime: qgis
spec:
  description: 按叠加图层裁剪输入图层
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OVERLAY
    type: layer
    required: true
    description: 叠加图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: clip
  param_mapping:
    INPUT: '{{ INPUT }}'
    OVERLAY: '{{ OVERLAY }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: subdivide
  keywords: ["按节点上限细分几何", "几何处理", "空间叠加", "几何修复"]
  display_name: "按节点上限细分几何"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 细分几何图形
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: MAX_NODES
    type: integer
    description: "最大节点数（数量，正整数）"
    default: 256
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: subdivide
  param_mapping:
    INPUT: '{{ INPUT }}'
    MAX_NODES: '{{ MAX_NODES }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

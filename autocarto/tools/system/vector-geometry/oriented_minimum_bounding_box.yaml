apiVersion: tool/v1
kind: Tool
metadata:
  name: oriented_minimum_bounding_box
  keywords: ["定向包围框", "分析定向包围框", "几何处理", "空间叠加", "几何修复"]
  display_name: "计算定向包围框"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 计算定向最小边界框
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: oriented_minimum_bounding_box
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

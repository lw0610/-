apiVersion: tool/v1
kind: Tool
metadata:
  name: set_m_value
  keywords: ["几何测量值", "配置几何测量值", "几何处理", "空间叠加", "几何修复"]
  display_name: "设置几何测量值"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 设置几何图形的M值
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: M_VALUE
    type: number
    description: "几何测量值（单位由输入数据的测量含义决定）"
    default: 0.0
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: set_m_value
  param_mapping:
    INPUT: '{{ INPUT }}'
    M_VALUE: '{{ M_VALUE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

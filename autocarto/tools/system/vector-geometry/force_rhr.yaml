apiVersion: tool/v1
kind: Tool
metadata:
  name: force_rhr
  display_name: 强制右手规则
  domain: vector-geometry
  runtime: qgis
spec:
  description: 强制多边形遵循右手规则
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: force_rhr
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

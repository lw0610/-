apiVersion: tool/v1
kind: Tool
metadata:
  name: force_rhr
  keywords: ["多边形环方向", "统一多边形环方向", "几何处理", "空间叠加", "几何修复"]
  display_name: "统一多边形环方向"
  domain: vector-geometry
  runtime: qgis
spec:
  description: 强制多边形遵循右手规则
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: force_rhr
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

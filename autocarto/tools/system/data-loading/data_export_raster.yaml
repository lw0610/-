apiVersion: tool/v1
kind: Tool
metadata:
  name: data_export_raster
  display_name: data_export_raster
  domain: data-loading
  runtime: qgis
spec:
  description: 导出栅格图层
  parameters:
    - name: layer
      type: string
      required: true
      description: 图层名称
    - name: output
      type: string
      description: 输出文件路径（可选）
execution:
  handler: handlers.loader.export_raster_handler
  param_mapping:
    layer: '{{ layer }}'
    output: '{{ output }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: data_load_list
  display_name: 批量加载数据
  keywords: [批量加载, 图层加载, 数据导入]
  domain: data-loading
  runtime: qgis
spec:
  description: 按内联文件列表加载矢量和栅格，默认复用已加载数据源，不转换坐标系、不写入原始数据目录。严格模式中必需文件缺失则不加载任何图层。
  parameters:
    - name: items
      type: array
      required: true
      description: 每项必须有name与path，可带kind（vector/raster）和required（默认true）。
      schema:
        type: array
        minItems: 1
        maxItems: 10000
        items:
          type: object
          required: [name, path]
          properties:
            name: {type: string}
            path: {type: string}
            layer_id: {type: string, description: 数据服务已加载图层的 ID，提供时只复用该有效图层}
            kind: {type: string, enum: [vector, raster]}
            required: {type: boolean, default: true}
    - {name: reuse_existing, type: boolean, default: true, description: 复用相同数据源}
    - {name: group, type: string, description: 可选图层分组}
    - {name: strict, type: boolean, default: true, description: 必需文件缺失时不加载任何图层}
execution:
  handler: handlers.loader.load_list_handler
  param_mapping:
    items: '{{ items }}'
    reuse_existing: '{{ reuse_existing }}'
    group: '{{ group }}'
    strict: '{{ strict }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: data_load_raster
  keywords: ["栅格图层", "导入栅格图层", "图层加载", "数据导入", "数据导出"]
  display_name: "加载栅格图层"
  domain: data-loading
  runtime: qgis
spec:
  description: >-
    加载本地栅格文件或复用已有 layer_id，默认立即显示到图层面板与画布。
    正式成图图层按流程从底到顶逐个加载，加载一层就显示一层；仅供计算的输入显式传 show=false 留在后台。同源文件复用并刷新内容。
  parameters:
    - name: path
      type: string
      description: 栅格文件路径，与 layer_id 至少提供一个；相对路径按项目根解析
    - {name: layer_id, type: string, description: 已准备的栅格图层 ID；提供时直接使用该图层，无需文件路径}
    - {name: show, type: boolean, default: true, description: 默认立即显示；false 仅在后台准备供计算。首次显示插到顶部，已显示图层保持位置}
    - name: layer_name
      type: string
      description: 图层名称（可选）
execution:
  handler: handlers.loader.load_raster_handler
  param_mapping:
    path: '{{ path }}'
    layer_id: '{{ layer_id }}'
    show: '{{ show }}'
    layer_name: '{{ layer_name }}'

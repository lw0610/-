apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_contour
  keywords: ["栅格等值线", "生成栅格等值线", "栅格处理", "矢量处理", "空间分析"]
  display_name: "生成栅格等值线"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 从栅格生成等值线
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入栅格
  - name: BAND
    type: integer
    description: "波段号（从 1 开始的波段序号）"
    default: 1
  - name: INTERVAL
    type: number
    description: "等值线间隔（与输入栅格数值单位一致，正数）"
    default: 10.0
  - name: OUTPUT
    type: output_layer
    description: 输出矢量
execution:
  backend_tool: gdal_contour
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    INTERVAL: '{{ INTERVAL }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

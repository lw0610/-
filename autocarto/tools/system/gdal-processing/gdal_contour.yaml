apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_contour
  display_name: 等值线
  domain: gdal-processing
  runtime: qgis
spec:
  description: 从栅格生成等值线
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入栅格
  - name: BAND
    type: integer
    description: 波段号
    default: 1
  - name: INTERVAL
    type: number
    description: 等值线间隔
    default: 10.0
  - name: OUTPUT
    type: output_layer
    description: 输出矢量
execution:
  backend_tool: gdal_contour
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    INTERVAL: '{{ INTERVAL }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

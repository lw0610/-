apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_offsetcurve
  keywords: ["偏移曲线", "生成偏移曲线", "栅格处理", "矢量处理", "空间分析"]
  display_name: "生成偏移曲线"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 创建偏移曲线
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入线图层
  - name: DISTANCE
    type: number
    required: true
    description: "偏移距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gdal:offsetcurve
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

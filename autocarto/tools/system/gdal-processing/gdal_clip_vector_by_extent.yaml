apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_clip_vector_by_extent
  keywords: ["按范围裁剪矢量", "栅格处理", "矢量处理", "空间分析"]
  display_name: 按范围裁剪矢量
  domain: gdal-processing
  runtime: qgis
spec:
  description: 按范围裁剪矢量图层
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入矢量图层
  - name: EXTENT
    type: extent
    required: true
    description: 裁剪范围
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gdal_clip_vector_by_extent
  param_mapping:
    INPUT: '{{ INPUT }}'
    EXTENT: '{{ EXTENT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_clip_raster_by_mask
  display_name: 按掩膜图层裁剪栅格
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用矢量掩膜裁剪栅格
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入栅格
  - name: MASK
    type: layer
    required: true
    description: 掩膜图层
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal_clip_raster_by_mask
  param_mapping:
    INPUT: '{{ INPUT }}'
    MASK: '{{ MASK }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

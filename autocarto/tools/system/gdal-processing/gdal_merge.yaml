apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_merge
  display_name: 栅格镶嵌
  domain: gdal-processing
  runtime: qgis
spec:
  description: 合并多个栅格为一个
  parameters:
  - name: INPUT
    type: multi_layer
    required: true
    description: 输入栅格列表
  - name: PCT
    type: boolean
    description: 抓取颜色表
    default: false
  - name: SEPARATE
    type: boolean
    description: 分离波段
    default: false
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal_merge
  param_mapping:
    INPUT: '{{ INPUT }}'
    PCT: '{{ PCT }}'
    SEPARATE: '{{ SEPARATE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_hillshade
  display_name: 山体阴影
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用GDAL计算山体阴影
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入DEM
  - name: BAND
    type: integer
    description: 波段号
    default: 1
  - name: Z_FACTOR
    type: number
    description: Z因子
    default: 1.0
  - name: AZIMUTH
    type: number
    description: 方位角
    default: 315.0
  - name: ALTITUDE
    type: number
    description: 高度角
    default: 45.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal_hillshade
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    Z_FACTOR: '{{ Z_FACTOR }}'
    AZIMUTH: '{{ AZIMUTH }}'
    ALTITUDE: '{{ ALTITUDE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

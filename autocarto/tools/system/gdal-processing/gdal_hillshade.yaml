apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_hillshade
  keywords: ["地形阴影", "分析地形阴影", "栅格处理", "矢量处理", "空间分析"]
  display_name: "计算地形阴影"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用GDAL计算山体阴影
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入DEM
  - name: BAND
    type: integer
    description: "波段号（从 1 开始的波段序号）"
    default: 1
  - name: Z_FACTOR
    type: number
    description: "高程夸张系数（无单位，正数）"
    default: 1.0
  - name: AZIMUTH
    type: number
    description: "光源方位角（度，0—360）"
    default: 315.0
  - name: ALTITUDE
    type: number
    description: "光源高度角（度，0—90）"
    default: 45.0
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal_hillshade
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    Z_FACTOR: '{{ Z_FACTOR }}'
    AZIMUTH: '{{ AZIMUTH }}'
    ALTITUDE: '{{ ALTITUDE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

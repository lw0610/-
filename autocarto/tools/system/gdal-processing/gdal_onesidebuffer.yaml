apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_onesidebuffer
  keywords: ["单侧缓冲区", "生成单侧缓冲区", "栅格处理", "矢量处理", "空间分析"]
  display_name: "创建单侧缓冲区"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 创建单侧缓冲区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入线图层
  - name: DISTANCE
    type: number
    required: true
    description: "缓冲距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
  - name: BUFFER_SIDE
    type: enum
    description: 缓冲侧(0=右,1=左)
    default: 0
    values:
    - 0
    - 1
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gdal_onesidebuffer
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    BUFFER_SIDE: '{{ BUFFER_SIDE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

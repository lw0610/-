apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_clip_vector_by_polygon
  keywords: ["按多边形裁剪矢量", "栅格处理", "矢量处理", "空间分析"]
  display_name: 按多边形裁剪矢量
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用多边形裁剪矢量图层
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入矢量图层
  - name: MASK
    type: layer
    required: true
    description: 裁剪多边形图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gdal_clip_vector_by_polygon
  param_mapping:
    INPUT: '{{ INPUT }}'
    MASK: '{{ MASK }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

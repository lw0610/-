apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_aspect
  display_name: 坡向
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用GDAL计算坡向
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入DEM
  - name: BAND
    type: integer
    description: 波段号
    default: 1
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal_aspect
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_aspect
  keywords: ["栅格坡向", "分析栅格坡向", "栅格处理", "矢量处理", "空间分析"]
  display_name: "计算栅格坡向"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用GDAL计算坡向
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入DEM
  - name: BAND
    type: integer
    description: "波段号（从 1 开始的波段序号）"
    default: 1
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal_aspect
  param_mapping:
    INPUT: '{{ INPUT }}'
    BAND: '{{ BAND }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_clip_raster_by_extent
  keywords: ["按范围裁剪栅格", "栅格处理", "矢量处理", "空间分析"]
  display_name: 按范围裁剪栅格
  domain: gdal-processing
  runtime: qgis
spec:
  description: 按范围裁剪栅格
  parameters:
  - name: INPUT
    type: raster_layer
    required: true
    description: 输入栅格
  - name: PROJWIN
    type: extent
    required: true
    description: 裁剪范围，格式为 xmin,xmax,ymin,ymax，可附 [EPSG:编号]；也可使用图层范围
  - name: OUTPUT
    type: output_raster
    description: 输出栅格
execution:
  backend_tool: gdal:cliprasterbyextent
  param_mapping:
    INPUT: '{{ INPUT }}'
    PROJWIN: '{{ PROJWIN }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

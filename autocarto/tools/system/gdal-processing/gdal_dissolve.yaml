apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_dissolve
  keywords: ["矢量要素", "融合矢量要素", "栅格处理", "矢量处理", "空间分析"]
  display_name: "融合矢量要素"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用GDAL融合矢量要素
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入矢量图层
  - name: FIELD
    type: field
    description: 融合字段
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gdal:dissolve
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

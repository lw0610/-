apiVersion: tool/v1
kind: Tool
metadata:
  name: gdal_buffer_vectors
  keywords: ["矢量缓冲区", "生成矢量缓冲区", "栅格处理", "矢量处理", "空间分析"]
  display_name: "创建矢量缓冲区"
  domain: gdal-processing
  runtime: qgis
spec:
  description: 使用GDAL创建矢量缓冲区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入矢量图层
  - name: DISTANCE
    type: number
    required: true
    description: "缓冲距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
  - name: DISSOLVE
    type: boolean
    description: 是否融合结果
    default: false
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gdal_buffer_vectors
  param_mapping:
    INPUT: '{{ INPUT }}'
    DISTANCE: '{{ DISTANCE }}'
    DISSOLVE: '{{ DISSOLVE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: viewshed
  display_name: 视域分析
  domain: visibility-analysis
  runtime: qgis
spec:
  description: 计算观察点的可视区域
  parameters:
    - name: INPUT
      type: raster_layer
      required: true
      description: 输入DEM
    - name: OBSERVER
      type: point
      required: true
      description: 观察点坐标
    - name: OBSERVER_HEIGHT
      type: number
      description: 观察者高度
      default: 1.0
    - name: TARGET_HEIGHT
      type: number
      description: 目标高度
      default: 1.0
    - name: MAX_DISTANCE
      type: number
      description: 最大分析距离
      default: 100.0
    - name: BAND
      type: integer
      description: 波段号
      default: 1
    - name: OUTPUT
      type: output_raster
      description: 输出栅格
execution:
  backend_tool: viewshed
  param_mapping:
    INPUT: '{{ INPUT }}'
    OBSERVER: '{{ OBSERVER }}'
    OBSERVER_HEIGHT: '{{ OBSERVER_HEIGHT }}'
    TARGET_HEIGHT: '{{ TARGET_HEIGHT }}'
    MAX_DISTANCE: '{{ MAX_DISTANCE }}'
    BAND: '{{ BAND }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

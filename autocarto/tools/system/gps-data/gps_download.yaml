apiVersion: tool/v1
kind: Tool
metadata:
  name: gps_download
  keywords: ["定位设备数据", "下载定位设备数据", "轨迹数据", "定位设备"]
  display_name: "下载定位设备数据"
  domain: gps-data
  runtime: qgis
spec:
  description: 从GPS设备下载数据
  parameters:
  - name: DEVICE
    type: string
    required: true
    description: GPS设备
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: gps_download
  param_mapping:
    DEVICE: '{{ DEVICE }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

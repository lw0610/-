apiVersion: tool/v1
kind: Tool
metadata:
  name: explode_hstore_field
  keywords: ["键值字段", "展开键值字段", "属性字段", "字段计算", "属性连接"]
  display_name: "展开键值字段"
  domain: vector-fields
  runtime: qgis
spec:
  description: 将HStore字段分解为多个独立字段
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD
    type: field
    required: true
    description: HStore字段
  - name: EXPECTED_FIELDS
    type: string
    description: 期望的字段名（逗号分隔）
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: explode_hstore_field
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    EXPECTED_FIELDS: '{{ EXPECTED_FIELDS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: rename_table_field
  keywords: ["属性字段", "重命名属性字段", "字段计算", "属性连接"]
  display_name: "重命名属性字段"
  domain: vector-fields
  runtime: qgis
spec:
  description: 重命名图层中的字段
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层 ID 或唯一名称；优先使用上一步返回的 layer_id
  - name: FIELD
    type: field
    required: true
    description: 要重命名的字段
  - name: NEW_NAME
    type: string
    required: true
    description: 新字段名称
  - name: OUTPUT
    type: output_layer
    description: 工作结果目标；字段治理沿用输入业务名称并替换其工程显示，保留原始文件，后续使用返回的 layer_id
    default: 'memory:'
execution:
  handler: handlers.attributes.rename_table_field_handler
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    NEW_NAME: '{{ NEW_NAME }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: split_features_by_character
  keywords: ["按字符拆分要素", "属性字段", "字段计算", "属性连接"]
  display_name: "按字符拆分要素"
  domain: vector-fields
  runtime: qgis
spec:
  description: 按字符分割要素属性
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD
    type: field
    required: true
    description: 分割字段
  - name: CHAR
    type: string
    required: true
    description: 分割字符
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: split_features_by_character
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    CHAR: '{{ CHAR }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: join_attributes_by_nearest
  keywords: ["按最近邻连接属性", "属性字段", "字段计算", "属性连接"]
  display_name: "按最近邻连接属性"
  domain: vector-fields
  runtime: qgis
spec:
  description: 按真实几何最近距离连接指定字段，保留未匹配要素并返回可继续使用的输出图层与匹配数量。距离使用输入图层的地图单位；需要米距离时请先使用合适的投影坐标系。
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: INPUT_2
    type: layer
    required: true
    description: 连接图层
  - name: FIELDS_TO_COPY
    type: fields
    description: 要复制的字段
  - name: MAX_DISTANCE
    type: number
    description: "最大距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
  - name: NEIGHBORS
    type: integer
    description: "最近邻数量（数量，正整数）"
    default: 1
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: native:joinbynearest
  param_mapping:
    INPUT: '{{ INPUT }}'
    INPUT_2: '{{ INPUT_2 }}'
    FIELDS_TO_COPY: '{{ FIELDS_TO_COPY }}'
    MAX_DISTANCE: '{{ MAX_DISTANCE }}'
    NEIGHBORS: '{{ NEIGHBORS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

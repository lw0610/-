apiVersion: tool/v1
kind: Tool
metadata:
  name: retain_fields
  keywords: ["指定字段", "保留指定字段", "属性字段", "字段计算", "属性连接"]
  display_name: "保留指定字段"
  domain: vector-fields
  runtime: qgis
spec:
  description: 保留指定字段，删除其他所有字段
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELDS
    type: fields
    required: true
    description: 要保留的字段列表
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  handler: handlers.attributes.retain_fields_handler
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELDS: '{{ FIELDS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

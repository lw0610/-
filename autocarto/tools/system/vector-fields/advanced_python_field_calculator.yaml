apiVersion: tool/v1
kind: Tool
metadata:
  name: advanced_python_field_calculator
  keywords: ["按脚本计算字段", "属性字段", "字段计算", "属性连接"]
  display_name: "按脚本计算字段"
  domain: vector-fields
  runtime: qgis
spec:
  description: 使用Python表达式计算字段值
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD_NAME
    type: string
    required: true
    description: 结果字段名称
  - name: FIELD_TYPE
    type: enum
    description: 字段类型
    default: 0
    values:
    - 0
    - 1
    - 2
  - name: FIELD_LENGTH
    type: integer
    description: "字段长度（字符位数，非负整数；具体限制由输出格式决定）"
    default: 10
  - name: FIELD_PRECISION
    type: integer
    description: "字段精度（小数位数，非负整数）"
    default: 3
  - name: GLOBAL
    type: string
    description: 全局表达式
    default: ""
  - name: FORMULA
    type: string
    required: true
    description: Python 代码，将结果赋给 value；字段使用 <字段名> 引用，例如 value = <name>。不是 feature 对象或直接字段变量。
  - name: OUTPUT
    type: output_layer
    description: 工作结果目标；沿用输入业务名称并替换原工程层，原文件不变，后续使用返回的新 layer_id
execution:
  handler: handlers.attributes.advanced_python_field_calculator_handler
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD_NAME: '{{ FIELD_NAME }}'
    FIELD_TYPE: '{{ FIELD_TYPE }}'
    FIELD_LENGTH: '{{ FIELD_LENGTH }}'
    FIELD_PRECISION: '{{ FIELD_PRECISION }}'
    GLOBAL: '{{ GLOBAL }}'
    FORMULA: '{{ FORMULA }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

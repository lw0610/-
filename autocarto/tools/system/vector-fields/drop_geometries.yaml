apiVersion: tool/v1
kind: Tool
metadata:
  name: drop_geometries
  keywords: ["要素几何", "删除要素几何", "属性字段", "字段计算", "属性连接"]
  display_name: "移除要素几何"
  domain: vector-fields
  runtime: qgis
spec:
  description: 移除图层的几何图形，保留属性表
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出表格
execution:
  backend_tool: drop_geometries
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

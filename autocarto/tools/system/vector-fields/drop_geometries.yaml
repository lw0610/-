apiVersion: tool/v1
kind: Tool
metadata:
  name: drop_geometries
  display_name: 丢弃几何图形
  domain: vector-fields
  runtime: qgis
spec:
  description: 移除图层的几何图形，保留属性表
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: OUTPUT
    type: output_layer
    description: 输出表格
execution:
  backend_tool: drop_geometries
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

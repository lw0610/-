apiVersion: tool/v1
kind: Tool
metadata:
  name: order_by_expression
  keywords: ["按表达式排序要素", "属性字段", "字段计算", "属性连接"]
  display_name: "按表达式排序要素"
  domain: vector-fields
  runtime: qgis
spec:
  description: 按表达式对要素排序
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: EXPRESSION
    type: expression
    required: true
    description: 排序表达式
  - name: ASCENDING
    type: boolean
    description: 升序排序
    default: true
  - name: NULLS_FIRST
    type: boolean
    description: 空值优先
    default: false
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: order_by_expression
  param_mapping:
    INPUT: '{{ INPUT }}'
    EXPRESSION: '{{ EXPRESSION }}'
    ASCENDING: '{{ ASCENDING }}'
    NULLS_FIRST: '{{ NULLS_FIRST }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

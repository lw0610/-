apiVersion: tool/v1
kind: Tool
metadata:
  name: text_to_float
  keywords: ["文本为浮点数", "转为文本为浮点数", "属性字段", "字段计算", "属性连接"]
  display_name: "转换文本为浮点数"
  domain: vector-fields
  runtime: qgis
spec:
  description: 将文本字段转换为浮点数字段
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD
    type: field
    required: true
    description: 文本字段
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  handler: handlers.attributes.text_to_float_handler
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: delete_column
  keywords: ["属性字段", "删除属性字段", "字段计算", "属性连接"]
  display_name: "删除属性字段"
  domain: vector-fields
  runtime: qgis
spec:
  description: 从图层中删除指定字段
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: COLUMN
    type: fields
    required: true
    description: 要删除的字段列表
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: delete_column
  param_mapping:
    INPUT: '{{ INPUT }}'
    COLUMN: '{{ COLUMN }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

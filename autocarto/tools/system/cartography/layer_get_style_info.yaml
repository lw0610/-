apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_get_style_info
  keywords: ["图层样式", "查询图层样式", "符号样式", "地图标注", "图层渲染"]
  display_name: "读取图层样式"
  runtime: qgis
  domain: cartography
spec:
  description: 获取图层样式详情
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
execution:
  handler: handlers.style.get_style_info_handler
  param_mapping:
    layer: '{{ layer }}'

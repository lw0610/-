apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_set_line_symbol
  keywords: ["线条符号", "配置线条符号", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置线条符号"
  runtime: qgis
  domain: cartography
spec:
  description: 根据线类型读取内置 QML 设置线图层符号，河流可同时沿线标注名称；建议改用按样式集上样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: line_type
    type: string
    required: true
    enum:
    - 铁路
    - 高速公路
    - 国道
    - 省界
    - 河流
    description: 线类型，支持铁路、高速公路、国道、省界、河流
  - name: label_field
    type: string
    required: false
    description: 河流名称字段；仅在线状河流需要沿线显示名称时传入
policy:
  visibility: hidden
execution:
  handler: handlers.style.set_line_symbol_handler
  param_mapping:
    layer: '{{ layer }}'
    line_type: '{{ line_type }}'
    label_field: '{{ label_field }}'

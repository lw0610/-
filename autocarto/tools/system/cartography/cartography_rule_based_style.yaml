apiVersion: tool/v1
kind: Tool
metadata:
  name: cartography_rule_based_style
  keywords: ["规则样式", "配置规则样式", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置规则样式"
  runtime: qgis
  domain: cartography
spec:
  description: 设置规则样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: rules
    type: array
    required: true
    description: 规则列表
execution:
  handler: handlers.style.rule_based_style_handler
  param_mapping:
    layer: '{{ layer }}'
    rules: '{{ rules }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_set_color_ramp
  keywords: ["图层色带", "配置图层色带", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置图层色带"
  runtime: qgis
  domain: cartography
spec:
  description: 设置分类或分级色带
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: color_ramp
    type: string
    required: true
    description: 色带名称
execution:
  handler: handlers.style.set_color_ramp_handler
  param_mapping:
    layer: '{{ layer }}'
    color_ramp: '{{ color_ramp }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: export_layout_pdf
  keywords: ["版面文档", "输出版面文档", "符号样式", "地图标注", "图层渲染"]
  display_name: "导出版面文档"
  runtime: qgis
  domain: cartography
spec:
  description: 导出布局为 PDF
  parameters:
  - name: LAYOUT
    type: string
    description: 布局名称（大写参数，兼容旧调用）
  - name: layout
    type: string
    description: 布局名称（推荐使用）
  - name: OUTPUT
    type: string
    description: 输出 PDF 路径（大写参数，兼容旧调用）
  - name: output
    type: string
    description: 输出 PDF 路径（推荐使用）
  - name: DPI
    type: number
    description: "导出分辨率（大写参数，兼容旧调用）（像素/英寸，正数）"
  - name: dpi
    type: number
    description: "导出分辨率（推荐使用）（像素/英寸，正数）"
execution:
  handler: handlers.layout_export.export_layout_pdf_handler
  param_mapping:
    LAYOUT: '{{ LAYOUT }}'
    layout: '{{ layout }}'
    OUTPUT: '{{ OUTPUT }}'
    output: '{{ output }}'
    DPI: '{{ DPI }}'
    dpi: '{{ dpi }}'

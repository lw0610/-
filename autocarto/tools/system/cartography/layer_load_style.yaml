apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_load_style
  keywords: ["图层样式", "导入图层样式", "符号样式", "地图标注", "图层渲染"]
  display_name: "加载图层样式"
  runtime: qgis
  domain: cartography
spec:
  description: 加载 QML 图层样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: style
    type: resource
    resource_type: style
    required: true
    description: 单个 QML 样式资源的名称、编号或路径
execution:
  handler: handlers.style.load_style_handler
  param_mapping:
    layer: '{{ layer }}'
    style: '{{ style }}'

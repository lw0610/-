apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_load_style
  keywords: ["图层样式", "导入图层样式", "符号样式", "地图标注", "图层渲染"]
  display_name: "加载图层样式"
  runtime: qgis
  domain: cartography
spec:
  description: 加载 QML 图层样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: style
    type: resource
    resource_type: style
    required: true
    description: 单个 QML 样式资源的名称、编号或路径
  - name: label_field
    type: string
    required: false
    description: 实际标注字段；未指定且样式字段缺失时尝试 NAME、name、name:zh、名称；无可用字段时关闭标注并返回警告；填“无”关闭标注
  - name: scale
    type: number
    required: false
    default: 1
    description: 纸张尺寸比例；A1=1，A4=0.35；保留符号结构并缩放线宽、点大小、偏移、虚线、标注及描边，字号最低1.8毫米、线宽最低0.1毫米
execution:
  handler: handlers.style.load_style_handler
  param_mapping:
    layer: '{{ layer }}'
    style: '{{ style }}'
    label_field: '{{ label_field }}'
    scale: '{{ scale }}'

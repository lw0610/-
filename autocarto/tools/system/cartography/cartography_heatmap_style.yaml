apiVersion: tool/v1
kind: Tool
metadata:
  name: cartography_heatmap_style
  keywords: ["热力渲染", "配置热力渲染", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置热力渲染"
  runtime: qgis
  domain: cartography
spec:
  description: 设置热力图样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 点图层名称
  - name: radius
    type: number
    description: "热力渲染半径（毫米）"
  - name: weight_field
    type: string
    description: 权重字段
execution:
  handler: handlers.style.heatmap_style_handler
  param_mapping:
    layer: '{{ layer }}'
    radius: '{{ radius }}'
    weight_field: '{{ weight_field }}'

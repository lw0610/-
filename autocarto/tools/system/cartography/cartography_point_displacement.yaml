apiVersion: tool/v1
kind: Tool
metadata:
  name: cartography_point_displacement
  keywords: ["点位移样式", "配置点位移样式", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置点位移样式"
  runtime: qgis
  domain: cartography
spec:
  description: 设置点位移样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 点图层名称
  - name: distance
    type: number
    description: "点位移容差（毫米）"
  - name: placement
    type: integer
    description: 放置方式(0=环形,1=同心)
execution:
  handler: handlers.style.point_displacement_style_handler
  param_mapping:
    layer: '{{ layer }}'
    distance: '{{ distance }}'
    placement: '{{ placement }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_set_marker_symbol
  keywords: ["点标记符号", "配置点标记符号", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置点标记符号"
  runtime: qgis
  domain: cartography
spec:
  description: 根据图层类型读取内置 QML 设置点图层符号和标注；建议改用按样式集上样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: layer_type
    type: string
    required: true
    enum:
    - city
    - county
    description: 图层类型，支持 city 或 county
  - name: label_field
    type: string
    required: true
    description: 标注字段名称
policy:
  visibility: hidden
execution:
  handler: handlers.style.set_marker_symbol_handler
  param_mapping:
    layer: '{{ layer }}'
    layer_type: '{{ layer_type }}'
    label_field: '{{ label_field }}'

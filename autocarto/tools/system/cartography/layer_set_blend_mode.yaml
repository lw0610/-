apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_set_blend_mode
  keywords: ["图层混合模式", "配置图层混合模式", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置图层混合模式"
  runtime: qgis
  domain: cartography
spec:
  description: 设置图层混合模式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: blend_mode
    type: string
    required: true
    description: 混合模式
  - name: feature_blend_mode
    type: string
    description: 要素混合模式
execution:
  handler: handlers.style.set_layer_blend_mode_handler
  param_mapping:
    layer: '{{ layer }}'
    blend_mode: '{{ blend_mode }}'
    feature_blend_mode: '{{ feature_blend_mode }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: layer_set_fill_symbol
  keywords: ["面填充符号", "配置面填充符号", "符号样式", "地图标注", "图层渲染"]
  display_name: "设置面填充符号"
  runtime: qgis
  domain: cartography
spec:
  description: 根据图层类型读取内置 QML 设置面图层填充符号和标注；建议改用按样式集上样式
  parameters:
  - name: layer
    type: string
    required: true
    description: 图层名称
  - name: layer_type
    type: string
    required: true
    enum:
    - 县
    - 市
    - 省
    - 河流
    description: 图层类型，支持县、市、省或河流
  - name: label_field
    type: string
    description: 标注字段名称；不填写则只设置面符号，不设置标注
policy:
  visibility: hidden
execution:
  handler: handlers.style.set_fill_symbol_handler
  param_mapping:
    layer: '{{ layer }}'
    layer_type: '{{ layer_type }}'
    label_field: '{{ label_field }}'

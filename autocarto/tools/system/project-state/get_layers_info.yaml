apiVersion: tool/v1
kind: Tool
metadata:
  name: get_layers_info
  display_name: get_layers_info
  domain: project-state
  runtime: qgis
spec:
  description: 获取当前项目中所有图层的详细信息列表
  parameters:
    - name: include_invisible
      type: boolean
      description: 是否包含不可见图层
execution:
  handler: handlers.project.get_layers_info
  param_mapping:
    include_invisible: '{{ include_invisible }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: get_active_layer_info
  keywords: ["活动图层信息", "查询活动图层信息", "地图工程", "图层状态", "工程管理"]
  display_name: "读取活动图层信息"
  domain: project-state
  runtime: qgis
spec:
  description: 获取当前选中的活动图层的详细信息
  parameters:
    - name: layer_name
      type: string
      description: 图层 ID 或唯一名称；优先使用上一步返回的 layer_id，不指定时使用当前活动图层
execution:
  handler: handlers.project.get_active_layer_info
  param_mapping:
    layer_name: '{{ layer_name }}'

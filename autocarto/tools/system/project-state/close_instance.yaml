apiVersion: tool/v1
kind: Tool
metadata:
  name: close_instance
  keywords: ["地图实例", "关闭地图实例", "地图工程", "图层状态", "工程管理"]
  display_name: "关闭地图实例"
  domain: project-state
  runtime: qgis
spec:
  description: 关闭当前 QGIS 实例
  parameters:
    - name: delay_ms
      type: integer
      description: 发起退出前的延迟毫秒数，确保结果能先返回
execution:
  handler: handlers.project.close_instance
  param_mapping:
    delay_ms: '{{ delay_ms }}'

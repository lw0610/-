apiVersion: tool/v1
kind: Tool
metadata:
  name: marching_route_compile_dataset
  keywords:
  - 路线数据集
  - 编译路线数据集
  - 路线知识
  - 图谱抽取
  - 数据集编译
  display_name: 编译路线数据集
  runtime: qgis
  domain: marching-route-knowledge
spec:
  description: 校验路线任务知识图谱，确定性生成路线绘制需要的六张数据表、符号资产和溯源文件。输入为结构化知识图谱，输出为可校验的数据集目录。
  parameters:
  - name: knowledge_json
    type: object
    required: true
    description: schema_version=1.0 的完整任务知识图谱对象；直接传入对象，不得序列化成 JSON 字符串或 Markdown 围栏
  - name: source_text
    type: string
    required: true
    description: 用于核对 evidence.quote 的原始史料或叙事文本
  - name: contract_id
    type: string
    required: true
    description: marching_route_get_extraction_contract 针对同一 source_text 返回的 contract_id
  - name: output_dir
    type: folder
    description: 生成数据集目录；不传时自动保存到当前任务 intermediate/route_knowledge，无任务会话时才使用系统临时目录
  - name: template_dataset_dir
    type: folder
    description: 可选模板数据集目录，用于复制相对路径注记图片
  - name: overwrite
    type: boolean
    description: 输出目录非空时是否替换，默认 false
  - name: validate_only
    type: boolean
    description: 仅校验，不生成或覆盖数据表；用于用户核对结果
  - name: review_context
    type: object
    description: 服务端签名的人工核对凭据；由核对流程注入，模型不得自行构造
  - name: route_style
    type: string
    description: 仅用户明确指定使用路线样式表时填写其预设名称；省略时按原版内置规则生成路线样式编号，不读取样式表。仅提出红蓝配色不代表选用样式表。
  - name: symbols
    type: string
    description: 仅用户明确指定使用符号表时填写其预设名称；省略时使用原版内置符号与事件映射，生成数据集的 symbol_mapping.csv。
execution:
  handler: handlers.knowledge.compile_marching_route_dataset_handler
  param_mapping:
    knowledge_json: '{{ knowledge_json }}'
    source_text: '{{ source_text }}'
    contract_id: '{{ contract_id }}'
    output_dir: '{{ output_dir }}'
    template_dataset_dir: '{{ template_dataset_dir }}'
    overwrite: '{{ overwrite }}'
    validate_only: '{{ validate_only }}'
    review_context: '{{ review_context }}'
    route_style: '{{ route_style }}'
    symbols: '{{ symbols }}'

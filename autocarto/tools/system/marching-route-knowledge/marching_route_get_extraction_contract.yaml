apiVersion: tool/v1
kind: Tool
metadata:
  name: marching_route_get_extraction_contract
  keywords: ["路线抽取规范", "查询路线抽取规范", "路线知识", "图谱抽取", "数据集编译"]
  display_name: "读取路线抽取规范"
  runtime: qgis
  domain: marching-route-knowledge
spec:
  description: "根据原始叙事返回路线知识图谱的完整 JSON Schema 和抽取规范。生成 knowledge_json 前先读取本工具返回的结构约束。"
  parameters:
  - name: source_text
    type: string
    required: true
    description: 用户提供的完整史料或路线叙事，原样传入
  - name: compact
    type: boolean
    required: false
    description: 默认 false；分块执行器设为 true 时仅返回规则与一份 schema，不重复返回原文
execution:
  handler: handlers.knowledge.get_marching_route_extraction_contract_handler
  param_mapping:
    source_text: '{{ source_text }}'
    compact: '{{ compact }}'

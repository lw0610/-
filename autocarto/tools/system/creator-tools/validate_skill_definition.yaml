  keywords: ["工具定义", "校验工具定义", "方案配置", "工具管理", "技能创建"]
  domain: creator-tools
  runtime: internal
spec:
  description: 校验技能工具定义是否合法。
  parameters:
  - name: definition
    type: object
    description: "待校验的工具定义对象"
    required: true
execution:
  backend_tool: validate_skill_definition
  param_mapping:
    definition: '{{ definition }}'

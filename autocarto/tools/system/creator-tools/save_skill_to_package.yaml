apiVersion: tool/v1
kind: Tool
metadata:
  name: save_skill_to_package
  display_name: "保存工具定义"
  keywords: ["工具定义", "保存工具定义", "方案配置", "工具管理", "技能创建"]
  domain: creator-tools
  runtime: internal
spec:
  description: 将工具定义保存到用户工具目录，并同步更新技能包的 tools 引用列表。
  parameters:
  - name: package_id
    type: string
    description: "目标技能包编号"
    required: true
  - name: definition
    type: object
    description: "符合工具定义结构的对象"
    required: true
execution:
  backend_tool: save_skill_to_package
  param_mapping:
    package_id: '{{ package_id }}'
    definition: '{{ definition }}'

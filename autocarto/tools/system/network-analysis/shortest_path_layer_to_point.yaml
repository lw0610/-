apiVersion: tool/v1
kind: Tool
metadata:
  name: shortest_path_layer_to_point
  keywords: ["图层到点最短路", "分析图层到点最短路", "路径分析", "最短路径", "服务范围"]
  display_name: "计算图层到点最短路"
  domain: network-analysis
  runtime: qgis
spec:
  description: 计算图层到点的最短路径
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 网络图层
  - name: START_POINTS
    type: layer
    required: true
    description: 起始点图层
  - name: END_POINT
    type: point
    required: true
    description: 终点
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: shortest_path_layer_to_point
  param_mapping:
    INPUT: '{{ INPUT }}'
    START_POINTS: '{{ START_POINTS }}'
    END_POINT: '{{ END_POINT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

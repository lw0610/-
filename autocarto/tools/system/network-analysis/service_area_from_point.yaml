apiVersion: tool/v1
kind: Tool
metadata:
  name: service_area_from_point
  keywords: ["按单点计算服务区", "路径分析", "最短路径", "服务范围"]
  display_name: "按单点计算服务区"
  domain: network-analysis
  runtime: qgis
spec:
  description: 从点计算服务区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 网络图层
  - name: START_POINT
    type: point
    required: true
    description: 起始点
  - name: TRAVEL_COST
    type: number
    required: true
    description: "距离成本阈值（默认最短路策略；单位由网络坐标系及工程测量设置决定）"
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: service_area_from_point
  param_mapping:
    INPUT: '{{ INPUT }}'
    START_POINT: '{{ START_POINT }}'
    TRAVEL_COST: '{{ TRAVEL_COST }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

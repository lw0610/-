apiVersion: tool/v1
kind: Tool
metadata:
  name: shortest_path_point_to_layer
  keywords: ["点到图层最短路", "分析点到图层最短路", "路径分析", "最短路径", "服务范围"]
  display_name: "计算点到图层最短路"
  domain: network-analysis
  runtime: qgis
spec:
  description: 计算点到图层的最短路径
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 网络图层
  - name: START_POINT
    type: point
    required: true
    description: 起始点
  - name: END_POINTS
    type: layer
    required: true
    description: 终点图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: shortest_path_point_to_layer
  param_mapping:
    INPUT: '{{ INPUT }}'
    START_POINT: '{{ START_POINT }}'
    END_POINTS: '{{ END_POINTS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

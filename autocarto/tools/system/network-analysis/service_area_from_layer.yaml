apiVersion: tool/v1
kind: Tool
metadata:
  name: service_area_from_layer
  display_name: 服务区(从图层)
  domain: network-analysis
  runtime: qgis
spec:
  description: 从图层计算服务区
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 网络图层
  - name: START_POINTS
    type: layer
    required: true
    description: 起始点图层
  - name: TRAVEL_COST
    type: number
    required: true
    description: 行程成本
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: service_area_from_layer
  param_mapping:
    INPUT: '{{ INPUT }}'
    START_POINTS: '{{ START_POINTS }}'
    TRAVEL_COST: '{{ TRAVEL_COST }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

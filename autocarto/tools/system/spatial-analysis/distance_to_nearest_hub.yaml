apiVersion: tool/v1
kind: Tool
metadata:
  name: distance_to_nearest_hub
  display_name: 到最近中心距离
  domain: spatial-analysis
  runtime: qgis
spec:
  description: 计算到最近中心点的距离
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入点图层
  - name: HUBS
    type: layer
    required: true
    description: 中心点图层
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: distance_to_nearest_hub
  param_mapping:
    INPUT: '{{ INPUT }}'
    HUBS: '{{ HUBS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

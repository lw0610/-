apiVersion: tool/v1
kind: Tool
metadata:
  name: export_mesh_edges
  keywords: ["网格边线", "输出网格边线", "统计图表", "网格数据", "数据可视化"]
  display_name: "导出网格边线"
  runtime: qgis
  domain: misc-tools
spec:
  description: 将网孔边线导出为线图层
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入网孔图层
  - name: OUTPUT
    type: output_layer
    description: 输出线图层
execution:
  backend_tool: export_mesh_edges
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: merge_vector_layers
  keywords: ["矢量图层", "合并矢量图层", "统计图表", "网格数据", "数据可视化"]
  display_name: 合并矢量图层
  runtime: qgis
  domain: misc-tools
spec:
  description: 将多个图层合并为一个
  parameters:
  - name: LAYERS
    type: multi_layer
    required: true
    description: 输入图层列表
  - name: CRS
    type: crs
    description: 目标坐标系
  - name: OUTPUT
    type: output_layer
    description: 输出图层
execution:
  backend_tool: merge_vector_layers
  param_mapping:
    LAYERS: '{{ LAYERS }}'
    CRS: '{{ CRS }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

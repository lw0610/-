apiVersion: tool/v1
kind: Tool
metadata:
  name: export_mesh_faces
  keywords: ["网格面", "输出网格面", "统计图表", "网格数据", "数据可视化"]
  display_name: "导出网格面"
  runtime: qgis
  domain: misc-tools
spec:
  description: 将网孔面导出为多边形图层
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入网孔图层
  - name: OUTPUT
    type: output_layer
    description: 输出多边形图层
execution:
  backend_tool: export_mesh_faces
  param_mapping:
    INPUT: '{{ INPUT }}'
    OUTPUT: '{{ OUTPUT }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: polar_plot
  display_name: 极坐标图
  runtime: qgis
  domain: misc-tools
spec:
  description: 创建极坐标图
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: NAME_FIELD
    type: field
    required: true
    description: 角度字段
  - name: VALUE_FIELD
    type: field
    required: true
    description: 数值字段
  - name: OUTPUT
    type: file
    description: 输出HTML文件
execution:
  backend_tool: polar_plot
  param_mapping:
    INPUT: '{{ INPUT }}'
    NAME_FIELD: '{{ NAME_FIELD }}'
    VALUE_FIELD: '{{ VALUE_FIELD }}'
    OUTPUT: '{{ OUTPUT }}'

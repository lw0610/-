apiVersion: tool/v1
kind: Tool
metadata:
  name: vector_layer_histogram
  keywords: ["字段直方图", "生成字段直方图", "统计图表", "网格数据", "数据可视化"]
  display_name: "生成字段直方图"
  runtime: qgis
  domain: misc-tools
spec:
  description: 创建矢量图层字段直方图
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: FIELD
    type: field
    required: true
    description: 数值字段
  - name: BINS
    type: integer
    description: "分组数量（数量，正整数）"
    default: 10
  - name: OUTPUT
    type: file
    description: 输出HTML文件
execution:
  backend_tool: vector_layer_histogram
  param_mapping:
    INPUT: '{{ INPUT }}'
    FIELD: '{{ FIELD }}'
    BINS: '{{ BINS }}'
    OUTPUT: '{{ OUTPUT }}'

apiVersion: tool/v1
kind: Tool
metadata:
  name: export_time_series_values
  keywords: ["时间序列数值", "输出时间序列数值", "统计图表", "网格数据", "数据可视化"]
  display_name: "导出时间序列数值"
  runtime: qgis
  domain: misc-tools
spec:
  description: 从点位置导出时间序列数据
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入网孔图层
  - name: DATASET_GROUPS
    type: string
    description: 数据集组
  - name: POINTS
    type: layer
    required: true
    description: 点图层
  - name: OUTPUT
    type: file
    description: 输出CSV文件
execution:
  backend_tool: export_time_series_values
  param_mapping:
    INPUT: '{{ INPUT }}'
    DATASET_GROUPS: '{{ DATASET_GROUPS }}'
    POINTS: '{{ POINTS }}'
    OUTPUT: '{{ OUTPUT }}'

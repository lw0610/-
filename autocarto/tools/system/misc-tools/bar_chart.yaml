apiVersion: tool/v1
kind: Tool
metadata:
  name: bar_chart
  display_name: 条形图
  runtime: qgis
  domain: misc-tools
spec:
  description: 创建条形图
  parameters:
  - name: INPUT
    type: layer
    required: true
    description: 输入图层
  - name: NAME_FIELD
    type: field
    required: true
    description: 类别字段
  - name: VALUE_FIELD
    type: field
    required: true
    description: 数值字段
  - name: OUTPUT
    type: file
    description: 输出HTML文件
execution:
  handler: handlers.charts.bar_chart_handler
  param_mapping:
    INPUT: '{{ INPUT }}'
    NAME_FIELD: '{{ NAME_FIELD }}'
    VALUE_FIELD: '{{ VALUE_FIELD }}'
    OUTPUT: '{{ OUTPUT }}'

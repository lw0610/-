apiVersion: tool/v1
kind: Tool
metadata:
  name: grass_r_watershed
  keywords: ["流域水文", "分析流域水文", "地形分析", "矢量分析", "水文分析"]
  display_name: "分析流域水文"
  domain: grass-analysis
  runtime: qgis
spec:
  description: 流域和水文分析
  parameters:
  - name: elevation
    type: raster_layer
    required: true
    description: 输入DEM
  - name: threshold
    type: integer
    description: "最小汇流阈值（栅格像元数量，正整数）"
    default: 10000
  - name: accumulation
    type: output_raster
    description: 汇流累积输出
  - name: drainage
    type: output_raster
    description: 流向输出
execution:
  backend_tool: grass_r_watershed
  param_mapping:
    elevation: '{{ elevation }}'
    threshold: '{{ threshold }}'
    accumulation: '{{ accumulation }}'
    drainage: '{{ drainage }}'
  output:
    auto_load: true

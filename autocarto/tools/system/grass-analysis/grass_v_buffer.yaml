apiVersion: tool/v1
kind: Tool
metadata:
  name: grass_v_buffer
  keywords: ["几何缓冲区", "生成几何缓冲区", "地形分析", "矢量分析", "水文分析"]
  display_name: "创建几何缓冲区"
  domain: grass-analysis
  runtime: qgis
spec:
  description: 创建矢量缓冲区
  parameters:
  - name: input
    type: layer
    required: true
    description: 输入矢量图层
  - name: distance
    type: number
    required: true
    description: "缓冲距离（所用坐标系的地图单位；投影坐标通常为米，地理坐标为度）"
  - name: output
    type: output_layer
    description: 输出图层
execution:
  backend_tool: grass_v_buffer
  param_mapping:
    input: '{{ input }}'
    distance: '{{ distance }}'
    output: '{{ output }}'
  output:
    auto_load: true

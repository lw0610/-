apiVersion: tool/v1
kind: Tool
metadata:
  name: grass_v_buffer
  display_name: GRASS缓冲区
  domain: grass-analysis
  runtime: qgis
spec:
  description: 创建矢量缓冲区
  parameters:
  - name: input
    type: layer
    required: true
    description: 输入矢量图层
  - name: distance
    type: number
    required: true
    description: 缓冲距离
  - name: output
    type: output_layer
    description: 输出图层
execution:
  backend_tool: grass_v_buffer
  param_mapping:
    input: '{{ input }}'
    distance: '{{ distance }}'
    output: '{{ output }}'
  output:
    auto_load: true

apiVersion: tool/v1
kind: Tool
metadata:
  name: web_read_page
  keywords: ["网页内容", "查询网页内容", "网页取数", "浏览器", "网络下载"]
  display_name: "读取网页内容"
  domain: browser-data-acquisition
  runtime: internal
spec:
  description: "读取公开 HTTP(S) 网页正文、JSON或文本及链接；图片和PDF保留真实文件并作为媒体附件提供给当前模型，需模型支持对应输入。返回来源URL和获取时间。不能执行页面脚本；动态网页改用浏览器。不会自动将图片/PDF转换成统计表。"
  parameters:
    - name: url
      type: string
      required: true
      description: "公开网页、文本、图片或PDF的HTTP(S) URL"
    - name: max_chars
      type: integer
      required: false
      description: "仅文本响应的最大返回字符数，1000–100000，默认20000；不适用于图片/PDF"
policy:
  visibility: public
  authorization_scopes:
    - tool.invoke
execution:
  backend_tool: web_read_page
  param_mapping:
    url: '{{ url }}'
    max_chars: '{{ max_chars }}'
